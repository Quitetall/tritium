[package]
name = "tritium-wasm"
description = "Scalar WebAssembly execution backend for wasm32-wasip1: the reference ternary mpGEMM, no host-only deps (no rayon, no linkme, no SIMD intrinsics)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tritium-core = { workspace = true }
tritium-spec = { workspace = true }
tritium-format = { workspace = true }
tritium-train = { workspace = true }
tritium-testkit = { workspace = true }
half = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[dev-dependencies]

[build-dependencies]
tritium-build-info = { workspace = true }

[lints]
workspace = true
