[package]
name = "tritium-candle"
description = "candle interop for Tritium: a `CustomOp1` that runs Tritium's ternary (BitNet b1.58) mpGEMM on a candle Tensor, bit-exact with the reference kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Lean by default: the heavy candle-core dep + the op are only pulled in with the
# `candle` feature (mirrors tritium-serve's `serve`). The default workspace build
# and `cargo test --workspace` stay candle-free; a dedicated CI lane runs the
# conformance gate with `--features candle`.
default = []
candle = ["dep:candle-core"]

[dependencies]
tritium-core = { workspace = true }
tritium-format = { workspace = true }
half = { workspace = true }
candle-core = { workspace = true, optional = true }

[dev-dependencies]
tritium-testkit = { workspace = true }

[lints]
workspace = true
