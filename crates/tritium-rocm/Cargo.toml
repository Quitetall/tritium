[package]
name = "tritium-rocm"
description = "AMD ROCm/HIP execution backend: raw HIP-runtime FFI host side + an addition-only ternary mpGEMM kernel (build.rs hipcc)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# build.rs shells `hipcc` to compile the HIP kernel to a code object — but ONLY
# when the `rocm` feature is active (it checks `CARGO_FEATURE_ROCM`), so a default
# Linux `cargo build` never invokes hipcc and needs no ROCm toolkit. Mirrors how
# tritium-cuda's build.rs guards nvcc behind `CARGO_FEATURE_CUDA`.
build = "build.rs"

[dependencies]
tritium-core = { workspace = true }
tritium-spec = { workspace = true }
tritium-runtime = { workspace = true }
# `tritium-format` is only needed by the GPU host path (packed-row byte sizing +
# host unpack of the trits the kernel reads), so it is pulled in solely by the
# `rocm` feature to keep the default Linux build lean — mirrors tritium-cuda.
tritium-format = { workspace = true, optional = true }
# `half::f16` is the TQ2_0 per-block scale type; the conformance packer + the host
# unpack scratch use it. Only the `rocm` feature touches it, so it is optional +
# pulled in by that feature, exactly like tritium-cuda.
half = { workspace = true, optional = true }
# `linkme` backs the `BACKENDS` self-registration in the (rocm-only) host module —
# the same distributed-slice mechanism tritium-cpu/tritium-cuda/tritium-runtime use.
# Only pulled in with the `rocm` feature, since the registration static is compiled
# only then. NOTE: linkme is unimplemented on wasm32, but this crate is x86_64/AMD-
# only and never built for wasm, so that is not a concern here.
linkme = { workspace = true, optional = true }

# All GPU code is gated behind `rocm`; the default build needs neither a HIP runtime
# nor a ROCm toolkit, so cpu-only CI stays green. We deliberately use RAW `extern "C"`
# FFI to the HIP runtime (hipModuleLoad / hipModuleGetFunction / hipMalloc / hipMemcpy
# / hipModuleLaunchKernel) declared in-crate, NOT an external HIP binding crate:
#   * the published HIP binding crates (hip-sys, hip-runtime-sys) are thin, sparsely
#     maintained, and pin to specific ROCm releases — a stale pin could fail to build
#     on the target box's actual ROCm version (the very failure mode tritium-cuda's
#     cudarc pin comments at length about);
#   * raw FFI against the small, ABI-stable HIP driver/runtime symbol set is fully
#     under our control, version-agnostic at compile time (resolved at link/load),
#     and adds ZERO external dependencies — so it can never be pulled into the
#     default Linux build. This mirrors how cudarc itself wraps the CUDA driver.
[features]
default = []
rocm = ["dep:tritium-format", "dep:half", "dep:linkme"]

# The conformance test only runs on the ROCm lane; these dev-deps are referenced
# solely from `#[cfg(feature = "rocm")]` test code (the testkit's frozen vectors +
# conformance runner). Mirrors tritium-cuda / tritium-wgpu.
[dev-dependencies]
tritium-testkit = { workspace = true }
tritium-format = { workspace = true }
half = { workspace = true }

[lints]
workspace = true
