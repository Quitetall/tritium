[package]
name = "tritium-train"
description = "STE autograd, QAT, optimizer, and LoRA for ternary BitNet models (single-node)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3 = { workspace = true }
tritium-core = { workspace = true }
tritium-format = { workspace = true }
tritium-spec = { workspace = true }
tritium-testkit = { workspace = true }
# Row-parallel dense matmul forward/vjp — the training hot path. Parallelizing over OUTPUT rows
# leaves each element's k-accumulation order untouched, so results are bit-identical to the serial
# loop (verified by the tape gradchecks + the ModelRunner conformance gate). Not in the wasm build.
rayon = { workspace = true }

[dev-dependencies]
half = { workspace = true }
# Property-based gates for LoRA (frozen-base zero-grad, merge correctness, rank edges) —
# ADR 0007. Workspace-pinned; already used by tritium-core/-cpu/-nn/-format/-quantize.
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Fisher-driven SALT plane allocation gate (plan 0039): the training-side diagonal Fisher feeds
# the quantize allocator's Sensitivity::Custom. tritium-quantize does NOT depend on tritium-train,
# so this dev-dep is acyclic. Also pulls the SALT dequant helper via tritium-format.
tritium-quantize = { workspace = true }

[build-dependencies]
tritium-build-info = { workspace = true }

[lints]
workspace = true
