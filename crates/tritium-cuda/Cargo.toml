[package]
name = "tritium-cuda"
description = "CUDA execution backend: cudarc host side + an addition-only ternary mpGEMM kernel (build.rs nvcc)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tritium-core = { workspace = true }
tritium-spec = { workspace = true }
tritium-runtime = { workspace = true }
# `tritium-format` is only needed by the GPU host path (packed-row byte sizing),
# so it is pulled in solely by the `cuda` feature to keep the default build lean.
tritium-format = { workspace = true, optional = true }
# `tritium-train` provides AdamW + the LR schedule + the CPU matmul vjp oracle for the QAT
# training step (the grad kernels' first real consumer, plan 0013). Pulled in by `cuda` only.
tritium-train = { workspace = true, optional = true }
# cudarc 0.19: driver API only (no cublas/curand/cudnn).
#
# `fallback-dynamic-loading` makes cudarc dlopen the CUDA driver (`libcuda`) at
# *runtime* instead of link-time, so its build script does NO link-time toolkit
# probing. But cudarc's `sys` FFI bindings are still version-gated at *compile*
# time and its build.rs demands exactly one `cuda-XXXXX` feature (or the
# `nvcc`-probing `cuda-version-from-build-system`, which panics on toolkit 13.3 —
# the very thing the 0.13 pin choked on). We therefore pin the *bindings* to the
# newest cudarc supports, `cuda-13020` (CUDA 13.2). The CUDA **Driver API** is
# forward-compatible within a major version, so 13.2 bindings call the same stable
# symbols (`cuCtxCreate`, `cuMemAlloc`, `cuModuleLoadData`, `cuLaunchKernel`, …) on
# the machine's 13.3 runtime driver — only the driver API subset this crate uses
# (context/stream/memcpy/module/launch), all unchanged across 13.x. We still load
# pre-built PTX from our own `build.rs` (nvcc), so cudarc's nvrtc path is unused.
#
# UPPER BOUND: this pin is valid for CUDA 13.x runtimes ONLY. On a CUDA 14.x host
# the ABI may shift and the dlopen'd driver could fail at first launch with a
# cryptic error. When cudarc ships a newer `cuda-130xx`/`cuda-14xxx` binding, bump
# this one feature. (A runtime `cuDriverGetVersion` major-version guard in
# `CudaBackend::new` is a deferred nicety to turn that into a clear diagnostic.)
#
# Declared directly (not via `workspace = true`) so this member can pin 0.19 and
# turn default features off independently of the root manifest.
#
# Features: `driver` (the only CUDA library we touch), `nvrtc` (gates the `Ptx`
# type and `CudaContext::load_module` — pure-Rust flag, no runtime `libnvrtc`
# dlopen unless you call `compile_ptx`, which we don't), and `std` (gates
# `DriverError`'s `Display`/`Error` impls). cublas/curand/runtime are left off.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "driver",
    "nvrtc",
    "std",
    "fallback-dynamic-loading",
    "cuda-13020",
    # cuBLASLt (dlopened via fallback-dynamic-loading) for the tensor-core training
    # tier: its `Matmul<f32>` uses CUBLAS_COMPUTE_32F_FAST_TF32 — tf32 tensor cores
    # with f32 I/O and fp32 accumulate. Only needs the driver; the lean default build
    # (no `cuda` feature) still pulls in no cudarc at all.
    "cublaslt",
] }
# `linkme` backs the `BACKENDS` self-registration in the (cuda-only) host module —
# same distributed-slice mechanism `tritium-cpu`/`tritium-runtime` use. Only pulled
# in with the `cuda` feature, since the registration static is compiled only then.
linkme = { workspace = true, optional = true }
# `serde`/`serde_json` back the on-disk autotune cache (WF-B): the winning
# `TileConfig` per (arch, dtype, shape-bucket, CUDA version) is serialised to JSON
# under `cache_dir()`. Only needed when the `cuda` feature wires up the tuner, so
# they are pulled in solely by that feature to keep the default build lean. The
# `autotune` module's serde *derives* are always compiled (the type is always built),
# but `serde` itself is a thin dep and these are workspace-pinned.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# `half::f16` is the GGUF's native `token_embd` precision; the cuda-graph decode (v0.3.4)
# uploads an f16 copy of the embedding table for the LM head (bit-identical, half the
# read). Only the `cuda` feature uses it, so it is optional + pulled in by that feature.
half = { workspace = true, optional = true }

# All GPU code is gated behind `cuda`; the default build needs neither cudarc nor
# a CUDA toolkit, so cpu-only CI stays green.
[features]
default = []
cuda = ["dep:cudarc", "dep:tritium-format", "dep:tritium-train", "dep:linkme", "dep:serde", "dep:serde_json", "dep:half"]
# Real NCCL collective backend (plan 0017): a `tritium_train::dist::ProcessGroup` impl over
# `cudarc::nccl`, validated on a ≥2-GPU box against the deterministic simulated reference (0014).
# cudarc's `nccl` feature pins the NCCL 2.30 bindings (`nccl-02030`) — the box needs `libnccl >= 2.30`
# (it ships in standard CUDA-13 / PyTorch images). Implies `cuda`; runs `world=1` on a single GPU.
nccl = ["cuda", "cudarc/nccl"]

# The conformance + parity tests only run on the GPU lane (Wave D); these dev-deps
# are referenced solely from `#[cfg(feature = "cuda")]` test code. `tritium-cpu`
# is the reference for the CPU↔CUDA parity gate (ADR 0002 U2).
[dev-dependencies]
tritium-testkit = { workspace = true }
tritium-format = { workspace = true }
tritium-cpu = { workspace = true }
# `half::f16` is the block-scale type the TQ2_0 packer takes; used only by the
# parity test's helper that packs trits the same way the testkit does.
half = { workspace = true }
# NOTE: `tritium-train` is a `cuda`-gated normal dependency (above), not a dev-dep — the GPU
# parity + QAT tests reach it through that, and it is the grad kernels' real consumer (0013).

[lints]
workspace = true
