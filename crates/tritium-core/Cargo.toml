[package]
name = "tritium-core"
description = "Foundational ternary types, dtypes, scaling schemes, and reference math for Tritium."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# Opt-in Serialize/Deserialize for the shared vocabulary enums (e.g.
# `TernaryFormat`). Used by `tritium-testkit`'s on-disk conformance vectors so
# the format tag serializes to its canonical lowercase token. Off by default to
# keep the foundation crate dependency-free / no_std-able.
serde = ["dep:serde"]

# Foundation crate: zero external runtime deps by design. The only thing every
# backend links is types + reference math — keep it minimal and no_std-able.
[dependencies]
# Optional: only pulled in under the `serde` feature (derive-only, no_std-compatible).
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
