[package]
name = "tritium-salt"
description = "High-level, resumable orchestration for SALT V2 additive ternarization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tritium-format = { workspace = true }
tritium-nn = { workspace = true }
tritium-train = { workspace = true }
tritium-cpu = { workspace = true }
tritium-cuda = { workspace = true, optional = true }
tritium-quantize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
half = { workspace = true }
tritium-nn = { workspace = true, features = ["test-fixtures"] }

[features]
default = []
cuda = ["dep:tritium-cuda", "tritium-nn/cuda"]

[lints]
workspace = true
