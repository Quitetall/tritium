language = "C"
header = "/* tritium.h — C ABI for Tritium inference. GENERATED by cbindgen from\n   tritium-ffi; do not edit by hand. Regenerate: cargo test -p tritium-ffi (the\n   header_is_current drift test prints the command on mismatch). */"
include_guard = "TRITIUM_FFI_H"
pragma_once = true
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "c99"

[export]
prefix = ""

[enum]
prefix_with_name = true
