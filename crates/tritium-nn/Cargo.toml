[package]
name = "tritium-nn"
description = "Inference layer over the ternary backend: nn ops, KV cache, and the BitNet model runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tritium-core = { workspace = true }
tritium-spec = { workspace = true }
tritium-format = { workspace = true }
tritium-runtime = { workspace = true }
tritium-train = { workspace = true }
half = { workspace = true }
blake3 = { workspace = true }
# Data-parallel host matmul for DenseLinear (the SALT/fp accuracy-eval projection).
rayon = { workspace = true }
# The CUDA backend, as an OPTIONAL dependency gated by the `cuda` feature (off by
# default). v0.3.1 (ADR 0013): the runner downcasts its `dyn TernaryBackend` to
# `tritium_cuda::CudaBackend` and builds a device-resident `CudaDecodeModel`, so the
# concrete type must be nameable in library code (not just tests) — hence a regular
# optional dep, not a dev-dependency. The default cpu-only build pulls in no `cudarc`
# and runs no `nvcc`; only `--features cuda` links it (and forwards its own `cuda`
# feature so the backend self-registers as `"cuda"` into the runtime `BACKENDS` slice).
tritium-cuda = { workspace = true, optional = true }
# `ModelConfig::from_hf_config` parses a HuggingFace `config.json` (library code, so a
# regular dep, not dev-only).
serde_json = { workspace = true }
# Real byte-level BPE behind the `tokenizer` feature: `GgufBpeTokenizer` builds a
# HuggingFace `tokenizers` pipeline from the vocab/merges a GGUF embeds (single-file
# UX — no sidecar tokenizer.json). Optional so the default build stays lean.
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde = { workspace = true }
# A concrete backend for the layer/forward integration tests (WF-3): the layers
# speak the `tritium-spec` contract, so the tests drive them through the CPU
# ternary mpGEMM. Not a runtime dependency of the crate.
tritium-cpu = { workspace = true }
# SALT accuracy harness (tests/salt_accuracy.rs): quantize the bf16 master and run
# perplexity through the host forward. Test-only, not a runtime dependency.
tritium-quantize = { workspace = true }
# `cargo test -p tritium-nn --features cuda` enables the CUDA backend (and its
# build.rs `nvcc` PTX compile) so the GPU acceptance + CPU↔CUDA parity tests in
# `tests/acceptance.rs` can build a `ModelRunner` on the `"cuda"` backend, and the
# library's device-resident decode path (`runner.rs`, cfg(cuda)) compiles. Without
# the feature those paths compile out entirely, keeping cpu-only CI (no GPU, no CUDA
# toolkit) green.
[features]
default = []
cuda = ["dep:tritium-cuda", "tritium-cuda/cuda"]
# Real text tokenization (GGUF-embedded byte-level BPE via the `tokenizers` crate).
tokenizer = ["dep:tokenizers"]

[lints]
workspace = true
