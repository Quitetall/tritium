[package]
name = "tritium-testkit"
description = "Conformance vectors + a generic harness any TernaryBackend runs to prove it matches the reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `serde` feature: serializes `TernaryFormat` to its canonical lowercase tag in
# the on-disk conformance vectors (ConformanceVector::format).
tritium-core = { workspace = true, features = ["serde"] }
tritium-spec = { workspace = true }
tritium-format = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
