[package]
name = "tritium-py"
description = "PyO3 bindings for Tritium: load a ternary GGUF model and generate tokens from Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# The Python extension module: a C dynamic library named `tritium`.
name = "tritium"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Loads the model and runs greedy generation; backend-generic via the registry.
tritium-nn = { workspace = true }
# The registry the helpers walk to pull a `cpu` backend out by name.
tritium-runtime = { workspace = true }
# The `TernaryBackend` trait the registry hands back.
tritium-spec = { workspace = true }
# Linked so the CPU backend self-registers into the runtime registry.
tritium-cpu = { workspace = true }
# Optional resident SALT V2 path for CUDA wheels. CPU-only abi3 wheels retain
# the lean default and fail closed on device="cuda".
tritium-cuda = { workspace = true, optional = true }
# Used by the low-level `ternary_matmul` helper to express problem geometry.
tritium-core = { workspace = true }
tritium-format = { workspace = true }
tritium-onnx = { workspace = true, features = ["qwen-package", "onnx"] }
# The autograd tape ops (ternary Conv1d, FSQ, STE) exposed to PyTorch via `src/ops.rs` (ADR 0030).
tritium-train = { workspace = true }
# Production SALT V2 evidence and resumable Qwen master-campaign orchestration.
tritium-quantize = { workspace = true }
tritium-salt = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
half = { workspace = true }
ort = { workspace = true }
# `abi3-py39`: build one wheel that works on CPython 3.9+ (forward-compatible).
pyo3 = { workspace = true, features = ["extension-module", "abi3-py39"] }
dlpark = { workspace = true }
ndarray = { workspace = true }

[build-dependencies]
tritium-build-info = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
default = []
cuda = ["dep:tritium-cuda", "tritium-cuda/cuda", "tritium-nn/cuda"]

[lints]
workspace = true
