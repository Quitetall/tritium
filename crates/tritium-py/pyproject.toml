[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pytritium"
description = "Ternary-model (BitNet) inference from Python, backed by the Rust Tritium engine."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Brian Lam", email = "briankhanglam@gmail.com" }]
keywords = ["ternary", "bitnet", "quantization", "inference"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

# torch is NOT required to run inference: `import tritium` works without it, which is
# what the description above promises. But 39 of the 57 python modules -- everything
# under tritium.torch -- import it at MODULE scope, and until now nothing declared
# that at all. `pip install pytritium` produced a package whose torch subpackage
# raised ModuleNotFoundError, i.e. the name advertised the one thing the install did
# not provide. Hence both halves of this change: the extra makes the dependency real
# and installable, and the rename stops the distribution promising it unconditionally.
[project.optional-dependencies]
torch = ["torch>=2.11"]

[project.urls]
Repository = "https://github.com/Quitetall/tritium"

[tool.maturin]
# The crate lives in the Cargo workspace; point maturin at its manifest and build
# an abi3 wheel (one wheel for CPython 3.9+). Mixed layout: the compiled extension is
# `tritium._tritium`, and the pure-Python `tritium` package (with the torch `autograd`
# wrappers) lives under `python/`.
manifest-path = "Cargo.toml"
module-name = "tritium._tritium"
python-source = "python"
features = ["extension-module", "onnx"]
# Mixed-layout builds copy the Python tree verbatim. Exclude interpreter caches
# explicitly so a local test run cannot contaminate a release wheel.
exclude = ["**/__pycache__/**", "**/*.pyc"]
