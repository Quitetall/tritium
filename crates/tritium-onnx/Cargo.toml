[package]
name = "tritium-onnx"
description = "ONNX Runtime interop for Tritium: a plain ternary (BitNet b1.58) mpGEMM kernel (always-on, bit-exact with the reference) plus an `ort` 2.x custom operator (feature `onnx`) exposing it as the ONNX node `TritiumTernaryMpGemm`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Lean by default: Layer 1 (the plain `ternary_mpgemm_kernel` + its bit-exact
# conformance gate) needs NO external deps, so the default build + `cargo test
# --workspace` pull ZERO of `ort`/`onnxruntime`. Layer 2 (the `ort` 2.x custom
# operator) lives behind the `onnx` feature, which makes `ort` an optional dep.
# `ort/download-binaries` fetches a prebuilt onnxruntime at build time so a CI
# lane with network can build + test `--features onnx` without a system lib.
default = []
onnx = ["dep:ort"]

[dependencies]
tritium-core = { workspace = true }
tritium-format = { workspace = true }
half = { workspace = true }
# `ort` with default-features off + the minimal set we need:
#   std            — Session / OperatorDomain need the std runtime
#   download-binaries + tls-rustls — fetch a prebuilt onnxruntime at build (no
#                    system lib, no system OpenSSL; rustls uses `ring`), so a CI
#                    lane with network builds + tests without a native install
#   copy-dylibs    — copy the fetched dylib next to the test/bin so it loads at runtime
#   api-22         — inspect the loaded model's custom-domain opset in the e2e gate
ort = { workspace = true, optional = true, features = [
    "std",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-22",
] }

[dev-dependencies]
tritium-testkit = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
