  smollm2-cpu-tutorial:
    name: pinned SmolLM2 PTQ/QAT tutorial · CPU
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: install pinned CPU model runtime
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: install pinned model and ONNX dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          transformers==5.5.3 safetensors==0.8.0 onnx==1.22.0
          onnxruntime==1.27.0 onnxscript==0.7.1
      - name: install the exact candidate wheel
        shell: bash
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --no-index --no-deps --only-binary=:all: dist/*.whl
      - name: run and validate pinned SmolLM2 CPU tutorial
        shell: bash
        env:
          TRITIUM_ONNX_PARITY_FAILURE_DIR: ${{ runner.temp }}/tritium-onnx-parity-failure
          TRITIUM_ONNX_PARITY_CAPTURE_TERMINAL: "1"
        run: |
          set -euo pipefail
          mkdir -p "$TRITIUM_ONNX_PARITY_FAILURE_DIR"
          python -m unittest scripts.tests.test_qualify_smollm2_release_tutorial -v
          python -u -I scripts/qualify-smollm2-release-tutorial.py \
            --wheel dist/*.whl \
            --output-dir evidence/smollm2-cpu \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-smollm2-cpu" &
          tutorial_pid=$!
          while kill -0 "$tutorial_pid" 2>/dev/null; do
            printf '[SMOLLM2_RESOURCE] utc=%s ' "$(date -u +%FT%TZ)"
            awk '/MemAvailable:/ { printf "mem_available_kib=%s ", $2 }' /proc/meminfo
            printf 'runner_temp_disk='
            df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { printf "available_kib=%s ", $4 }'
            printf 'runner_online_cpus='
            getconf _NPROCESSORS_ONLN | tr -d '\n'
            printf ' runner_total_logical_cpus='
            nproc --all | tr -d '\n'
            printf ' runner_cpu_model='
            awk -F: '/model name/ { gsub(/^[[:space:]]+/, "", $2); printf "%s", $2; exit }' /proc/cpuinfo
            printf ' omp_num_threads=%s mkl_num_threads=%s' "${OMP_NUM_THREADS:-unset}" "${MKL_NUM_THREADS:-unset}"
            printf ' load_average='
            awk '{ printf "1m=%s,5m=%s,15m=%s ", $1, $2, $3 }' /proc/loadavg
            if [[ -r /sys/fs/cgroup/cpu.max ]]; then
              printf 'cgroup_cpu_max='
              tr ' ' '/' < /sys/fs/cgroup/cpu.max | tr -d '\n'
              printf ' '
            fi
            if [[ -r /sys/fs/cgroup/cpu.stat ]]; then
              printf 'cgroup_cpu_stat='
              tr '\n' ',' < /sys/fs/cgroup/cpu.stat
              printf ' '
            fi
            if [[ -r /sys/fs/cgroup/memory.current ]]; then
              printf 'cgroup_memory_current_bytes=%s ' "$(< /sys/fs/cgroup/memory.current)"
            fi
            if [[ -r /sys/fs/cgroup/memory.events ]]; then
              printf 'cgroup_memory_events='
              tr '\n' ',' < /sys/fs/cgroup/memory.events
              printf ' '
            fi
            printf 'top_processes_rss_kib_comm='
            ps -eo rss=,comm= --sort=-rss | sed -n '1,5p' | tr '\n' ';'
            printf '\n'
            sleep 15
          done
          set +e
          wait "$tutorial_pid"
          tutorial_status=$?
          set -e
          exit "$tutorial_status"
      - name: retain opt-in ONNX parity diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smollm2-onnx-parity-diagnostic
          path: ${{ runner.temp }}/tritium-onnx-parity-failure/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smollm2-cpu-tutorial
          path: evidence/smollm2-cpu/**
          if-no-files-found: error
      # Receipt consumers should not need to download model/optimizer payloads
      # just to inspect the measured tutorial gate. Keep the full replay archive
      # above and publish its unchanged receipt separately.
      - name: retain lightweight SmolLM2 tutorial receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smollm2-cpu-tutorial-receipt
          path: evidence/smollm2-cpu/receipt.json
          if-no-files-found: error

  cuda-wheel-smoke:
    name: Linux CUDA 13 wheel · Torch 2.11 · Python 3.13 · sm_89
    # Opt-in only. This used to fire on any tag, which meant a release requested a
    # self-hosted sm89 runner -- and no self-hosted runner is registered on this
    # repository at all. A queued job is not a failed job: `build` would never
    # complete, so collect/pypi/github-release/crates would never start and the
    # release would hang rather than fail. `inputs.build_cuda` covers both the
    # dispatch input and the workflow_call input above.
    if: ${{ inputs.build_cuda }}
    runs-on: [self-hosted, linux, x64, cuda, sm89]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: require qualified CUDA 13 runner
        shell: bash
        run: |
          set -euo pipefail
          NVCC="$(command -v nvcc)"
          COMPUTE_SANITIZER="$(command -v compute-sanitizer)"
          test -x "$NVCC"
          test -x "$COMPUTE_SANITIZER"
          "$NVCC" --version | grep -E 'release 13\.'
          "$COMPUTE_SANITIZER" --version
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv
      - name: test CUDA manylinux build contract
        run: >-
          python -m unittest
          scripts.tests.test_build_cuda_manylinux_wheel
          scripts.tests.test_verify_wheel -v
      - name: build CUDA manylinux abi3 wheel
        shell: bash
        run: scripts/build-cuda-manylinux-wheel.sh dist-cuda
      - name: verify CUDA wheel structure
        run: >-
          python scripts/verify-wheel.py dist-cuda
          --require-platform-tag manylinux_2_28_x86_64
      - name: generate exact CUDA-wheel CycloneDX SBOM
        run: >-
          python scripts/generate-wheel-sbom.py
          --wheel dist-cuda
          --artifact-id pytritium-linux-cuda13-sm89
          --output dist-cuda/pytritium-linux-cuda13-sm89.cdx.json
      - name: install pinned CUDA PyTorch and Hugging Face stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            torch==2.11.0 --index-url https://download.pytorch.org/whl/cu130
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            transformers==5.5.3 safetensors==0.8.0 accelerate==1.10.0 \
            pytest==9.0.2
          python -m pip install --isolated --disable-pip-version-check \
            --no-index --no-deps --only-binary=:all: --force-reinstall dist-cuda/*.whl
      - name: qualify exact-wheel CUDA dispatcher and memcheck
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist-cuda/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/qualify-torch-dispatch-cuda.py \
            --repo "$PWD" \
            --python "$(command -v python)" \
            --wheel "${wheels[0]}" \
            --compute-sanitizer "$(command -v compute-sanitizer)" \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-dispatch-cuda \
            --output-dir evidence/torch-dispatch-cuda
          python scripts/verify-torch-dispatch-cuda-receipt.py \
            evidence/torch-dispatch-cuda/receipt.json \
            --repo "$PWD" \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
            --wheel "${wheels[0]}"
      - name: execute installed-wheel CUDA kernel and lifecycle
        shell: bash
        run: >-
          python -I ${{ github.workspace }}/scripts/wheel-functional-smoke.py
          --wheel dist-cuda
          --forbidden-root ${{ github.workspace }}
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --device cuda:0
          --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-cuda-functional
          --output evidence/cuda13-torch2.11-py3.13-sm89.json
      - name: execute installed-wheel CUDA PyTorch QAT tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I ${{ github.workspace }}/examples/python/installed_qat.py \
            --output-dir evidence/tutorial-cuda \
            --device cuda:0 \
            --wheel-artifact dist-cuda/*.whl \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-tutorial-cuda
          python -I -m tritium.torch.tutorial_qat \
            --check-receipt evidence/tutorial-cuda/receipt.json \
            --device cuda:0 \
            --wheel-artifact dist-cuda/*.whl \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
      - name: qualify installed-wheel CUDA fp16 training
        shell: bash
        env:
          TRITIUM_CUDA_CHECKPOINT: ${{ runner.temp }}/tritium-cuda-training-state
          TRITIUM_CUDA_RECEIPT: ${{ github.workspace }}/evidence/cuda13-fp16-training.json
          TRITIUM_SOURCE_REVISION: ${{ env.TRITIUM_SOURCE_REVISION }}
          TRITIUM_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-cuda-training
        run: |
          set -euo pipefail
          # Derived, not written down: an `env:` literal here stamped the wrong release
          # onto every receipt from the moment the workspace version moved.
          TRITIUM_RELEASE="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          export TRITIUM_RELEASE
          wheels=(dist-cuda/*.whl)
          test "${#wheels[@]}" -eq 1
          export TRITIUM_QUALIFIED_ARTIFACT="${wheels[0]}"
          export TRITIUM_ARTIFACT_KIND=python-wheel
          python -I crates/tritium-py/tests/hf_cuda_worker.py
          python scripts/verify-cuda-training-receipt.py \
            evidence/cuda13-fp16-training.json \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
            --artifact "$TRITIUM_QUALIFIED_ARTIFACT"
      - name: execute generated five-minute SmolLM2 notebook
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            nbformat==5.10.4 nbconvert==7.17.1 ipykernel==7.3.0
          python scripts/generate-colab-notebook.py --check
          python -m unittest scripts.tests.test_generate_colab_notebook -v
          mkdir -p evidence/colab
          cp examples/colab/tritium-smollm2-v11.ipynb evidence/colab/executed.ipynb
          TRITIUM_WHEEL=dist-cuda \
          TRITIUM_OUTPUT_DIR="$PWD/evidence/colab/artifacts" \
            python -m jupyter nbconvert --execute --to notebook --inplace \
              --ExecutePreprocessor.timeout=600 evidence/colab/executed.ipynb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-cuda13-torch2.11-python3.13-sm89
          path: |
            dist-cuda/*.whl
            dist-cuda/*.cdx.json
            evidence/**
          if-no-files-found: error
