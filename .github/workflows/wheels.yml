# Python wheels (ADR 0033 / v1.1 hardening): build distributable binary wheels
# for the PyO3 extension crate `tritium-py` (crates/tritium-py), whose lib
# is a `cdylib` named `tritium` (excluded from `cargo test --workspace` — it is
# exercised via maturin + pytest, not cargo test).
#
# The crate builds ONE abi3 wheel per platform (pyo3 `abi3-py39`: forward-
# compatible with CPython 3.9+), so the matrix is over OS/arch, not Python
# version. Built with maturin via the official PyO3 `maturin-action`, mirroring
# what `maturin generate-ci github` emits for an abi3 project.
#
# Triggers: git tags (release builds), manual dispatch, and a build-only smoke on
# pull_request so the packaging path stays green without gating every push.
#
# Plan 0051 forbids source-build fallback for unsupported combinations, so this
# workflow intentionally produces no sdist. It does NOT publish to PyPI: no token,
# `twine upload`, no `maturin publish`, no trusted-publishing step. Wheels and
# qualification receipts are uploaded as build artifacts only.
name: wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    # Build-only smoke: a tag/dispatch builds the full matrix; on PRs we keep the
    # packaging path honest without running it on every commit to main.
    paths:
      - "crates/tritium-py/**"
      - "scripts/verify-wheel.py"
      - "scripts/tests/test_verify_wheel.py"
      - "scripts/aggregate-wheel-smoke.py"
      - "scripts/tests/test_aggregate_wheel_smoke.py"
      - "scripts/wheel-functional-smoke.py"
      - "scripts/tests/test_wheel_functional_smoke.py"
      - "scripts/build-cuda-manylinux-wheel.sh"
      - "scripts/tests/test_build_cuda_manylinux_wheel.py"
      - "scripts/build-cpu-manylinux-wheel.sh"
      - "scripts/tests/test_build_cpu_manylinux_wheel.py"
      - "scripts/generate-wheel-sbom.py"
      - "scripts/tests/test_generate_wheel_sbom.py"
      - "scripts/generate-colab-notebook.py"
      - "scripts/tests/test_generate_colab_notebook.py"
      - "examples/colab/tritium-smollm2-v11.ipynb"
      - "examples/python/installed_qat.py"
      - "scripts/tests/test_installed_qat_tutorial.py"
      - "scripts/tests/test_hf_lifecycle.py"
      - "crates/tritium-py/python/tritium/torch/hf_export_lifecycle.py"
      - "crates/tritium-py/tests/test_hf_export_lifecycle.py"
      - "scripts/qualify-hf-distributed.py"
      - "scripts/verify-hf-distributed-receipt.py"
      - "scripts/tests/test_qualify_hf_distributed.py"
      - "scripts/tests/test_verify_hf_distributed_receipt.py"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
    inputs:
      build_cuda:
        description: Build and execute the CUDA 13 wheel on a qualified GPU runner
        required: false
        type: boolean
        default: false

# A new push to a PR cancels the previous wheel build for that PR.
concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One abi3 wheel per (os, target). `maturin-action` runs manylinux builds in a
  # container by default, so the linux wheels are manylinux-tagged and portable.
  wheels:
    name: wheel · ${{ matrix.platform.os }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux (manylinux, built in the maturin container).
          - { os: linux, runner: ubuntu-latest, target: x86_64, target_id: linux-x86_64-cpu, smoke: true }
          # macOS (universal2 covers both Apple Silicon + Intel in one wheel).
          - { os: macos, runner: macos-latest, target: universal2, target_id: macos-arm64-cpu, smoke: true }
          # Windows.
          - { os: windows, runner: windows-latest, target: x64, target_id: windows-x86_64-cpu, smoke: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: test wheel verifier
        run: python -m unittest scripts.tests.test_verify_wheel -v
      - name: test pinned CPU manylinux builder contract
        if: matrix.platform.target_id == 'linux-x86_64-cpu'
        shell: bash
        run: python -m unittest scripts.tests.test_build_cpu_manylinux_wheel -v
      - name: build Linux CPU abi3 wheel in pinned manylinux image
        if: matrix.platform.target_id == 'linux-x86_64-cpu'
        shell: bash
        run: scripts/build-cpu-manylinux-wheel.sh dist
      - name: build non-Linux abi3 wheel
        if: matrix.platform.target_id != 'linux-x86_64-cpu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          # Build metadata must remain authenticated even when maturin's
          # manylinux container does not receive the checkout's .git directory.
          TRITIUM_SOURCE_ID: source-git:${{ github.sha }}
        with:
          # The crate lives in the workspace; point maturin at its manifest.
          # --release for distributable artifacts; the abi3 feature comes from
          # the crate's Cargo.toml + pyproject.toml [tool.maturin].
          command: build
          args: --release --manifest-path crates/tritium-py/Cargo.toml --out dist
          target: ${{ matrix.platform.target }}
          # Container manylinux build for linux; `auto` is a no-op off-linux.
          manylinux: ${{ matrix.platform.os == 'linux' && 'auto' || 'off' }}
          sccache: "true"
      - name: verify wheel structure and integrity
        if: ${{ !matrix.platform.smoke }}
        shell: bash
        run: python scripts/verify-wheel.py dist
      - name: verify clean no-source wheel install
        if: ${{ matrix.platform.smoke }}
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id ${{ matrix.platform.target_id }}
          --source-revision ${{ github.sha }}
          --receipt dist/${{ matrix.platform.target_id }}.json
      - name: generate exact-wheel CycloneDX SBOM
        shell: bash
        run: >-
          python scripts/generate-wheel-sbom.py
          --wheel dist
          --artifact-id tritium-torch-${{ matrix.platform.target_id }}
          --output dist/tritium-torch-${{ matrix.platform.target_id }}.cdx.json
      - name: upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: |
            dist/*.whl
            dist/*.json
          if-no-files-found: error

  abi3-smoke:
    name: abi3 · ${{ matrix.platform.os }} · Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - { os: linux, runner: ubuntu-latest, target: x86_64, target_id: linux-x86_64-cpu }
          - { os: windows, runner: windows-latest, target: x64, target_id: windows-x86_64-cpu }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
      - name: install exact abi3 wheel and run native smoke
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id ${{ matrix.platform.target_id }}
          --source-revision ${{ github.sha }}
          --smoke-evidence evidence/${{ matrix.platform.target_id }}-cp${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abi3-${{ matrix.platform.os }}-cp${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  abi3-smoke-macos-arm64:
    name: abi3 · macOS arm64 · Python ${{ matrix.python }}
    needs: wheels
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub's arm64 image does not provide CPython 3.9/3.10.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-macos-universal2
          path: dist
      - name: install exact abi3 wheel and run native smoke
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id macos-arm64-cpu
          --source-revision ${{ github.sha }}
          --smoke-evidence evidence/macos-arm64-cpu-cp${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abi3-macos-cp${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  abi3-admit:
    name: admit complete abi3 matrix
    needs: [abi3-smoke, abi3-smoke-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: abi3-*
          path: evidence
          merge-multiple: true
      - name: aggregate exact interpreter matrix
        run: >-
          python scripts/aggregate-wheel-smoke.py evidence
          --source-revision ${{ github.sha }}
          --release 1.1.0-rc.1
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-abi3-matrix
          --output receipts/python-abi3-39-plus.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abi3-compatibility-receipt
          path: receipts/python-abi3-39-plus.json
          if-no-files-found: error

  torch-functional-smoke:
    name: installed wheel · Torch 2.11 · Python 3.13
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: test functional-smoke admission
        run: python -m unittest scripts.tests.test_wheel_functional_smoke -v
      - name: install pinned binary dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: install pinned Hugging Face dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          transformers==5.5.3 safetensors==0.8.0
      - name: install exact Tritium wheel without dependency resolution
        shell: bash
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --no-index --no-deps --only-binary=:all: dist/*.whl
      - name: test installed tutorial receipt admission
        run: >-
          python -m unittest discover
          -s crates/tritium-py/tests
          -p test_tutorial_qat.py
          -v
      - name: test two-GPU qualification contracts
        run: >-
          python -m unittest
          scripts.tests.test_qualify_hf_distributed
          scripts.tests.test_verify_hf_distributed_receipt
          -v
      - name: run installed-wheel differentiable lifecycle
        run: >-
          python -I ${{ github.workspace }}/scripts/wheel-functional-smoke.py
          --wheel dist
          --forbidden-root ${{ github.workspace }}
          --source-revision ${{ github.sha }}
          --release 1.1.0-rc.1
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-cpu-functional
          --output evidence/torch-2.11-python-3.13.json
      - name: execute installed-wheel PyTorch QAT tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I ${{ github.workspace }}/examples/python/installed_qat.py \
            --output-dir evidence/tutorial-cpu \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-tutorial-cpu
          python -I -m tritium.torch.tutorial_qat \
            --check-receipt evidence/tutorial-cpu/receipt.json \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - name: qualify installed-wheel API signature
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify-api-signature.py \
            --repo "$GITHUB_WORKSPACE" \
            --python "$(command -v python)" \
            --wheel dist/*.whl \
            --api-report docs/generated/api-diff-v1.0-v1.1.json \
            --source-revision "${{ github.sha }}" \
            --release 1.1.0-rc.1 \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-api-signature" \
            --output-dir evidence/api-signature
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-functional-torch-2.11-python-3.13
          path: |
            evidence/torch-2.11-python-3.13.json
            evidence/tutorial-cpu/**
            evidence/tutorial-cpu/receipt.json
            evidence/api-signature/**
          if-no-files-found: error

  tutorial-clean-wheel:
    name: source-free wheel tutorial · Python 3.13 slim
    needs: wheels
    runs-on: ubuntu-latest
    container: python:3.13-slim
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: require source-free compiler-free environment
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.git"
          test ! -e "$GITHUB_WORKSPACE/Cargo.toml"
          for compiler in cargo rustc cc c++ gcc g++ clang clang++; do
            if command -v "$compiler" >/dev/null 2>&1; then
              echo "compiler must be absent in source-free lane: $compiler" >&2
              exit 1
            fi
          done
      - name: install pinned binary runtime and exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            safetensors==0.8.0 transformers==5.5.3 \
            tensorboard==2.21.0 wandb==0.28.1 \
            opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0
          python -m pip install --isolated --disable-pip-version-check \
            --no-index --no-deps --only-binary=:all: --no-compile dist/*.whl
      - name: execute and validate source-free installed tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I -m tritium.torch.tutorial_qat \
            --output-dir evidence/tutorial-clean \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-tutorial-clean
          python -I -m tritium.torch.tutorial_qat \
            --check-receipt evidence/tutorial-clean/receipt.json \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - name: execute and validate installed Hugging Face lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python -I -m tritium.torch.hf_lifecycle \
            --output-dir evidence/hf-lifecycle-clean \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-hf-lifecycle-clean
          python -I -m tritium.torch.hf_lifecycle \
            --check-receipt evidence/hf-lifecycle-clean/receipt.json \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - name: execute and validate whole-model hard export
        shell: bash
        run: |
          set -euo pipefail
          python -I -m tritium.torch.hf_export_lifecycle \
            --output-dir evidence/hf-export-clean \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-hf-export-clean
          python -I -m tritium.torch.hf_export_lifecycle \
            --check-receipt evidence/hf-export-clean/receipt.json \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - name: execute and validate installed observability adapters
        shell: bash
        run: |
          set -euo pipefail
          python -B -I -m tritium.torch.qualify_observability \
            --output-dir evidence/observability-clean \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-observability-clean
          python -B -I -m tritium.torch.qualify_observability \
            --check-receipt evidence/observability-clean/receipt.json \
            --wheel-artifact dist/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-tutorial-source-free-python-3.13
          path: |
            evidence/tutorial-clean/**
            evidence/hf-lifecycle-clean/**
            evidence/hf-export-clean/**
            evidence/observability-clean/**
          if-no-files-found: error

  cuda-wheel-smoke:
    name: Linux CUDA 13 wheel · Torch 2.11 · Python 3.13 · sm_89
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_cuda)
    runs-on: [self-hosted, linux, x64, cuda, sm89]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.89.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: require qualified CUDA 13 runner
        shell: bash
        run: |
          set -euo pipefail
          NVCC="$(command -v nvcc)"
          COMPUTE_SANITIZER="$(command -v compute-sanitizer)"
          test -x "$NVCC"
          test -x "$COMPUTE_SANITIZER"
          "$NVCC" --version | grep -E 'release 13\.'
          "$COMPUTE_SANITIZER" --version
          nvidia-smi --query-gpu=name,compute_cap,driver_version --format=csv
      - name: test CUDA manylinux build contract
        run: >-
          python -m unittest
          scripts.tests.test_build_cuda_manylinux_wheel
          scripts.tests.test_verify_wheel -v
      - name: build CUDA manylinux abi3 wheel
        shell: bash
        run: scripts/build-cuda-manylinux-wheel.sh dist-cuda
      - name: verify CUDA wheel structure
        run: >-
          python scripts/verify-wheel.py dist-cuda
          --require-platform-tag manylinux_2_28_x86_64
      - name: generate exact CUDA-wheel CycloneDX SBOM
        run: >-
          python scripts/generate-wheel-sbom.py
          --wheel dist-cuda
          --artifact-id tritium-torch-linux-cuda13-sm89
          --output dist-cuda/tritium-torch-linux-cuda13-sm89.cdx.json
      - name: install pinned CUDA PyTorch and Hugging Face stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            torch==2.11.0 --index-url https://download.pytorch.org/whl/cu130
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            transformers==5.5.3 safetensors==0.8.0 accelerate==1.10.0 \
            pytest==9.0.2
          python -m pip install --isolated --disable-pip-version-check \
            --no-index --no-deps --only-binary=:all: --force-reinstall dist-cuda/*.whl
      - name: qualify exact-wheel CUDA dispatcher and memcheck
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist-cuda/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/qualify-torch-dispatch-cuda.py \
            --repo "$PWD" \
            --python "$(command -v python)" \
            --wheel "${wheels[0]}" \
            --compute-sanitizer "$(command -v compute-sanitizer)" \
            --source-revision "${{ github.sha }}" \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-dispatch-cuda \
            --output-dir evidence/torch-dispatch-cuda
          python scripts/verify-torch-dispatch-cuda-receipt.py \
            evidence/torch-dispatch-cuda/receipt.json \
            --repo "$PWD" \
            --source-revision "${{ github.sha }}" \
            --release 1.1.0-rc.1 \
            --wheel "${wheels[0]}"
      - name: execute installed-wheel CUDA kernel and lifecycle
        shell: bash
        run: >-
          python -I ${{ github.workspace }}/scripts/wheel-functional-smoke.py
          --wheel dist-cuda
          --forbidden-root ${{ github.workspace }}
          --source-revision ${{ github.sha }}
          --device cuda:0
          --release 1.1.0-rc.1
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-cuda-functional
          --output evidence/cuda13-torch2.11-py3.13-sm89.json
      - name: execute installed-wheel CUDA PyTorch QAT tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I ${{ github.workspace }}/examples/python/installed_qat.py \
            --output-dir evidence/tutorial-cuda \
            --device cuda:0 \
            --wheel-artifact dist-cuda/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1 \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-tutorial-cuda
          python -I -m tritium.torch.tutorial_qat \
            --check-receipt evidence/tutorial-cuda/receipt.json \
            --device cuda:0 \
            --wheel-artifact dist-cuda/*.whl \
            --source-revision ${{ github.sha }} \
            --release 1.1.0-rc.1
      - name: qualify installed-wheel CUDA fp16 training
        shell: bash
        env:
          TRITIUM_CUDA_CHECKPOINT: ${{ runner.temp }}/tritium-cuda-training-state
          TRITIUM_CUDA_RECEIPT: ${{ github.workspace }}/evidence/cuda13-fp16-training.json
          TRITIUM_SOURCE_REVISION: ${{ github.sha }}
          TRITIUM_RELEASE: 1.1.0-rc.1
          TRITIUM_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-cuda-training
        run: |
          set -euo pipefail
          wheels=(dist-cuda/*.whl)
          test "${#wheels[@]}" -eq 1
          export TRITIUM_QUALIFIED_ARTIFACT="${wheels[0]}"
          export TRITIUM_ARTIFACT_KIND=python-wheel
          python -I crates/tritium-py/tests/hf_cuda_worker.py
          python scripts/verify-cuda-training-receipt.py \
            evidence/cuda13-fp16-training.json \
            --source-revision "${{ github.sha }}" \
            --release 1.1.0-rc.1 \
            --artifact "$TRITIUM_QUALIFIED_ARTIFACT"
      - name: execute generated five-minute SmolLM2 notebook
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            nbformat==5.10.4 nbconvert==7.17.1 ipykernel==7.3.0
          python scripts/generate-colab-notebook.py --check
          python -m unittest scripts.tests.test_generate_colab_notebook -v
          mkdir -p evidence/colab
          cp examples/colab/tritium-smollm2-v11.ipynb evidence/colab/executed.ipynb
          TRITIUM_WHEEL=dist-cuda \
          TRITIUM_OUTPUT_DIR="$PWD/evidence/colab/artifacts" \
            python -m jupyter nbconvert --execute --to notebook --inplace \
              --ExecutePreprocessor.timeout=600 evidence/colab/executed.ipynb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-cuda13-torch2.11-python3.13-sm89
          path: |
            dist-cuda/*.whl
            dist-cuda/*.cdx.json
            evidence/**
          if-no-files-found: error
