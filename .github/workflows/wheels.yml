# Python wheels (ADR 0033 / v1.1 hardening): build distributable binary wheels
# for the PyO3 extension crate `tritium-py` (crates/tritium-py), whose lib
# is a `cdylib` named `tritium` (excluded from `cargo test --workspace` — it is
# exercised via maturin + pytest, not cargo test).
#
# The crate builds ONE abi3 wheel per platform (pyo3 `abi3-py39`: forward-
# compatible with CPython 3.9+), so the matrix is over OS/arch, not Python
# version. Built with maturin via the official PyO3 `maturin-action`, mirroring
# what `maturin generate-ci github` emits for an abi3 project.
#
# Triggers: git tags (release builds), manual dispatch, and a build-only smoke on
# pull_request so the packaging path stays green without gating every push.
#
# Plan 0051 forbids source-build fallback for unsupported combinations, so this
# workflow intentionally produces no sdist. It does NOT publish to PyPI: no token,
# `twine upload`, no `maturin publish`, no trusted-publishing step. Wheels and
# qualification receipts are uploaded as build artifacts only.
name: wheels

on:
  # Tags no longer trigger this workflow directly: release.yml owns the tag and
  # calls it via workflow_call. Keeping both triggers would build the whole
  # matrix twice on every release, and publish from whichever finished first.
  workflow_call:
    inputs:
      source_ref:
        description: Exact branch or tag to build. Empty uses caller ref.
        required: false
        type: string
        default: ""
      source_revision:
        description: Exact checked-out Git object ID. Empty uses caller SHA.
        required: false
        type: string
        default: ""
      build_cuda:
        description: >-
          Build and execute the CUDA 13 wheel. Requires a registered
          [self-hosted, linux, x64, cuda, sm89] runner; without one the job
          queues forever and every downstream release job waits on it.
        required: false
        type: boolean
        default: false
  pull_request:
    # Build-only smoke: a release (or dispatch) builds the full matrix; on PRs we
    # keep the packaging path honest without running it on every commit to main.
    paths:
      - "crates/tritium-py/**"
      # The wheel links the whole workspace, so a dependency or toolchain move can
      # break it without touching a path above. #34 bumped burn and the lockfile
      # and never reached this workflow; that bump happened to be outside the wheel's
      # graph, but nothing here established that -- it was luck, not coverage.
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/verify-wheel.py"
      - "scripts/tests/test_verify_wheel.py"
      - "scripts/verify-workflow-source.py"
      - "scripts/tests/test_verify_workflow_source.py"
      - "scripts/aggregate-wheel-smoke.py"
      - "scripts/tests/test_aggregate_wheel_smoke.py"
      - "scripts/wheel-functional-smoke.py"
      - "scripts/tests/test_wheel_functional_smoke.py"
      - "crates/tritium-py/python/tritium/torch/qualify_dispatch_overhead.py"
      - "scripts/qualify-torch-dispatch-overhead.py"
      - "scripts/verify-torch-dispatch-overhead-receipt.py"
      - "scripts/tests/test_qualify_torch_dispatch_overhead.py"
      - "scripts/tests/test_verify_torch_dispatch_overhead_receipt.py"
      - "scripts/tests/test_torch_dispatch_overhead_workflow.py"
      - "scripts/build-cuda-manylinux-wheel.sh"
      - "scripts/tests/test_build_cuda_manylinux_wheel.py"
      - "scripts/build-cpu-manylinux-wheel.sh"
      - "scripts/tests/test_build_cpu_manylinux_wheel.py"
      - "scripts/generate-wheel-sbom.py"
      - "scripts/tests/test_generate_wheel_sbom.py"
      - "scripts/generate-colab-notebook.py"
      - "scripts/tests/test_generate_colab_notebook.py"
      - "examples/colab/tritium-smollm2-v11.ipynb"
      - "scripts/qualify-smollm2-release-tutorial.py"
      - "scripts/tests/test_qualify_smollm2_release_tutorial.py"
      - "scripts/qualify-onnx-inference.py"
      - "scripts/verify-onnx-inference-receipt.py"
      - "scripts/tests/test_qualify_onnx_inference.py"
      - "scripts/tests/test_verify_onnx_inference_receipt.py"
      - "examples/python/installed_qat.py"
      - "scripts/tests/test_installed_qat_tutorial.py"
      - "scripts/tests/test_hf_lifecycle.py"
      - "crates/tritium-py/python/tritium/torch/hf_export_lifecycle.py"
      - "crates/tritium-py/tests/test_hf_export_lifecycle.py"
      - "scripts/qualify-hf-distributed.py"
      - "scripts/verify-hf-distributed-receipt.py"
      - "scripts/tests/test_qualify_hf_distributed.py"
      - "scripts/tests/test_verify_hf_distributed_receipt.py"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or ref to build; empty uses the dispatch ref.
        required: false
        type: string
        default: ""
      source_revision:
        description: Exact checked-out Git object ID to bind into receipts; empty uses the dispatch SHA.
        required: false
        type: string
        default: ""
      build_cuda:
        description: Build and execute the CUDA 13 wheel on a qualified GPU runner
        required: false
        type: boolean
        default: false

# A new push to a PR cancels the previous wheel build for that PR.
concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep caller-controlled revisions in the environment, never inline them
  # into shell source. PR wheel artifacts bind to the PR head (rather than
  # GitHub's synthetic merge SHA) so their receipts match the candidate commit.
  # Other event types use the caller/dispatch SHA unless an exact revision was
  # explicitly supplied.
  TRITIUM_SOURCE_REF: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.ref }}
  TRITIUM_SOURCE_REVISION: ${{ inputs.source_revision || github.event.pull_request.head.sha || github.sha }}

jobs:
  # One abi3 wheel per (os, target). `maturin-action` runs manylinux builds in a
  # container by default, so the linux wheels are manylinux-tagged and portable.
  wheels:
    name: wheel · ${{ matrix.platform.os }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    # Every matrix leg emits the same value, so whichever finishes last wins
    # deterministically. Downstream jobs consume it instead of re-deriving --
    # the source-free tutorial lane asserts Cargo.toml is ABSENT, so a per-step
    # `grep Cargo.toml` there returned "" and the receipt writer refused with
    # "release and run id must be non-empty".
    outputs:
      release: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux (manylinux, built in the maturin container).
          - { os: linux, runner: ubuntu-24.04, target: x86_64, target_id: linux-x86_64-cpu, smoke: true }
          # macOS arm64. The ONNX Runtime dependency has no prebuilt
          # x86_64-apple-darwin binary, so universal2 would claim a slice that
          # cannot be built. The qualified compatibility cell is arm64.
          - { os: macos, runner: macos-latest, target: aarch64, target_id: macos-arm64-cpu, smoke: true }
          # Windows.
          - { os: windows, runner: windows-latest, target: x64, target_id: windows-x86_64-cpu, smoke: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - name: test exact source identity contract
        run: python -m unittest scripts.tests.test_verify_workflow_source -v
      - name: resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: test wheel verifier
        run: python -m unittest scripts.tests.test_verify_wheel -v
      - name: test pinned CPU manylinux builder contract
        if: matrix.platform.target_id == 'linux-x86_64-cpu'
        shell: bash
        run: python -m unittest scripts.tests.test_build_cpu_manylinux_wheel -v
      - name: build Linux CPU abi3 wheel in pinned manylinux image
        if: matrix.platform.target_id == 'linux-x86_64-cpu'
        shell: bash
        run: scripts/build-cpu-manylinux-wheel.sh dist
      - name: build non-Linux abi3 wheel
        if: matrix.platform.target_id != 'linux-x86_64-cpu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          # Build metadata must remain authenticated even when maturin's
          # manylinux container does not receive the checkout's .git directory.
          TRITIUM_SOURCE_ID: source-git:${{ env.TRITIUM_SOURCE_REVISION }}
        with:
          # The crate lives in the workspace; point maturin at its manifest.
          # --release for distributable artifacts; the abi3 feature comes from
          # the crate's Cargo.toml + pyproject.toml [tool.maturin].
          command: build
          args: --release --manifest-path crates/tritium-py/Cargo.toml --out dist
          target: ${{ matrix.platform.target }}
          # Container manylinux build for linux; `auto` is a no-op off-linux.
          manylinux: ${{ matrix.platform.os == 'linux' && 'auto' || 'off' }}
          sccache: "true"
      - name: verify wheel structure and integrity
        if: ${{ !matrix.platform.smoke }}
        shell: bash
        run: python scripts/verify-wheel.py dist
      - name: verify clean no-source wheel install
        if: ${{ matrix.platform.smoke }}
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id ${{ matrix.platform.target_id }}
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --receipt dist/${{ matrix.platform.target_id }}.json
      - name: generate exact-wheel CycloneDX SBOM
        shell: bash
        run: >-
          python scripts/generate-wheel-sbom.py
          --wheel dist
          --artifact-id pytritium-${{ matrix.platform.target_id }}
          --output dist/pytritium-${{ matrix.platform.target_id }}.cdx.json
      - name: upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: |
            dist/*.whl
            dist/*.json
          if-no-files-found: error

  abi3-smoke:
    name: abi3 · ${{ matrix.platform.os }} · Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - { os: linux, runner: ubuntu-24.04, target: x86_64, target_id: linux-x86_64-cpu }
          - { os: windows, runner: windows-latest, target: x64, target_id: windows-x86_64-cpu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
      - name: install exact abi3 wheel and run native smoke
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id ${{ matrix.platform.target_id }}
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --smoke-evidence evidence/${{ matrix.platform.target_id }}-cp${{ matrix.python }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: abi3-${{ matrix.platform.os }}-cp${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  abi3-smoke-macos-arm64:
    name: abi3 · macOS arm64 · Python ${{ matrix.python }}
    needs: wheels
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub's arm64 image does not provide CPython 3.9/3.10.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheel-macos-aarch64
          path: dist
      - name: install exact abi3 wheel and run native smoke
        shell: bash
        run: >-
          python scripts/verify-wheel.py dist --install-smoke
          --target-id macos-arm64-cpu
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --smoke-evidence evidence/macos-arm64-cpu-cp${{ matrix.python }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: abi3-macos-cp${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  abi3-admit:
    name: admit complete abi3 matrix
    # `wheels` is listed directly, not just transitively: job outputs are only
    # exposed to jobs that name the producer in their own `needs`.
    needs: [wheels, abi3-smoke, abi3-smoke-macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: abi3-*
          path: evidence
          merge-multiple: true
      - name: aggregate exact interpreter matrix
        run: >-
          python scripts/aggregate-wheel-smoke.py evidence
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --release "${{ needs.wheels.outputs.release }}"
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-abi3-matrix
          --output receipts/python-abi3-39-plus.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: abi3-compatibility-receipt
          path: receipts/python-abi3-39-plus.json
          if-no-files-found: error

  torch-functional-smoke:
    name: installed wheel · Torch 2.11 · Python 3.13
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRITIUM_SOURCE_REF }}
      - name: verify checked-out source revision
        shell: bash
        run: python scripts/verify-workflow-source.py --expected-revision "$TRITIUM_SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: test functional-smoke admission
        run: python -m unittest scripts.tests.test_wheel_functional_smoke -v
      - name: install pinned binary dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: install pinned Hugging Face dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          transformers==5.5.3 safetensors==0.8.0 pytest==9.0.2 zstandard==0.25.0
      - name: install exact Tritium wheel without dependency resolution
        shell: bash
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --no-index --no-deps --only-binary=:all: --no-compile dist/*.whl
      - name: qualify public PTQ row-fitting parallelism
        run: python -m unittest scripts.tests.test_ptq_parallelism -v
      - name: test exact-wheel public PTQ artifacts and ONNX custody
        env:
          TRITIUM_TEST_INSTALLED_WHEEL: "1"
          TRITIUM_TEST_CANDIDATE_WHEEL_DIR: dist
        run: >-
          python -I -m pytest -q
          crates/tritium-py/tests/test_ptq_artifacts.py
          crates/tritium-py/tests/test_bundle_binding.py
          crates/tritium-py/tests/test_qualify_onnx_worker.py
          crates/tritium-py/tests/test_hf_candidate_provenance.py
          crates/tritium-py/tests/test_hf_lifecycle_receipt.py
          crates/tritium-py/tests/test_hf_export_lifecycle.py
          crates/tritium-py/tests/test_tutorial_candidate_provenance.py
          crates/tritium-py/tests/test_observability_candidate_provenance.py
          crates/tritium-py/tests/test_estimator_candidate_provenance.py
          crates/tritium-py/tests/test_qualify_estimators.py
      - name: test installed tutorial receipt admission
        run: >-
          python -m unittest discover
          -s crates/tritium-py/tests
          -p test_tutorial_qat.py
          -v
      - name: test two-GPU qualification contracts
        run: >-
          python -m unittest
          scripts.tests.test_qualify_hf_distributed
          scripts.tests.test_verify_hf_distributed_receipt
          -v
      - name: run installed-wheel differentiable lifecycle
        run: >-
          python -I ${{ github.workspace }}/scripts/wheel-functional-smoke.py
          --wheel dist
          --forbidden-root ${{ github.workspace }}
          --source-revision "$TRITIUM_SOURCE_REVISION"
          --release "${{ needs.wheels.outputs.release }}"
          --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-cpu-functional
          --output evidence/torch-2.11-python-3.13.json
      - name: execute installed-wheel PyTorch QAT tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I ${{ github.workspace }}/examples/python/installed_qat.py \
            --output-dir evidence/tutorial-cpu \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}" \
            --run-id github-${{ github.run_id }}-${{ github.run_attempt }}-tutorial-cpu
          python -I -m tritium.torch.tutorial_qat \
            --check-receipt evidence/tutorial-cpu/receipt.json \
            --device cpu \
            --wheel-artifact dist/*.whl \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}"
      - name: qualify installed-wheel API signature
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify-api-signature.py \
            --repo "$GITHUB_WORKSPACE" \
            --python "$(command -v python)" \
            --wheel dist/*.whl \
            --api-report docs/generated/api-diff-v1.0-v1.1.json \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-api-signature" \
            --output-dir evidence/api-signature
      - name: qualify installed-wheel CPU dispatcher overhead
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="$GITHUB_WORKSPACE/${wheels[0]}"
          cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          trace="$GITHUB_WORKSPACE/evidence/torch-dispatch-overhead-trace.json"
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cd "$RUNNER_TEMP"
          python -I -B -m tritium.torch.qualify_dispatch_overhead \
            --output "$trace" \
            --wheel "$wheel" \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-torch-dispatch-overhead" \
            --cpu "$cpu"
          cd "$GITHUB_WORKSPACE"
          python scripts/qualify-torch-dispatch-overhead.py \
            --repo "$GITHUB_WORKSPACE" \
            --wheel "$wheel" \
            --trace "$trace" \
            --source-revision "$TRITIUM_SOURCE_REVISION" \
            --release "${{ needs.wheels.outputs.release }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-torch-dispatch-overhead" \
            --output-dir evidence/torch-dispatch-overhead
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheel-functional-torch-2.11-python-3.13
          path: |
            evidence/torch-2.11-python-3.13.json
            evidence/tutorial-cpu/**
            evidence/tutorial-cpu/receipt.json
            evidence/api-signature/**
            evidence/torch-dispatch-overhead-trace.json
            evidence/torch-dispatch-overhead/**
          if-no-files-found: error

  tutorial-clean-wheel:
    name: source-free wheel tutorial · Python 3.13 slim
    needs: wheels
    runs-on: ubuntu-24.04
    # Official Python 3.13 slim linux/amd64 manifest, byte-identical on Docker
    # Hub and ECR Public. Avoid shared-runner Docker Hub anonymous pull quotas;
    # keep the source-free/compiler-free qualification environment immutable.
    container: public.ecr.aws/docker/library/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: require source-free compiler-free environment
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.git"
          test ! -e "$GITHUB_WORKSPACE/Cargo.toml"
          for compiler in cargo rustc cc c++ gcc g++ clang clang++; do
            if command -v "$compiler" >/dev/null 2>&1; then
              echo "compiler must be absent in source-free lane: $compiler" >&2
              exit 1
            fi
          done
      - name: install pinned binary runtime and exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            safetensors==0.8.0 transformers==5.5.3 \
            tensorboard==2.21.0 wandb==0.28.1 \
            opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0
          python -m pip install --isolated --disable-pip-version-check \
            --no-index --no-deps --only-binary=:all: --no-compile dist/*.whl
      - name: execute and validate source-free installed tutorial
        shell: bash
        run: |
          set -euo pipefail
          python -I -m tritium.torch.tutorial_qat \
            --output-dir evidence/tutorial-clean \
            --device cpu \
