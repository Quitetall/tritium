# Tag -> artifacts -> registries, with provenance.
#
# Until this existed the repo had 39 tags and 0 GitHub Releases: wheels and SBOMs
# lived only as 90-day Actions artifacts, so no downstream consumer could obtain a
# build, and every publish was a human running a script with a long-lived token.
# The 1.1.0rc1 wheels on PyPI were uploaded that way, from a tree 314 commits
# past the tag they claim -- which is the failure this workflow is meant to end.
#
# The build is not duplicated here. wheels.yml owns the matrix, the abi3
# compatibility sweep and the per-wheel SBOM; this calls it, so a release ships the
# exact artifacts CI already qualified rather than a second build that merely
# resembles them.
#
# PyPI uses trusted publishing (OIDC): no API token exists to leak or rotate. That
# requires a one-time publisher registration on PyPI -- see SUPPORT.md; until it is
# registered the pypi job fails closed rather than falling back to a secret.
name: release

on:
  push:
    tags: ["v*"]
  # Re-run publication for an existing tag without moving it (a transient registry
  # failure should not need a new tag).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.1.0-rc.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-publish: a half-uploaded set of wheels is worse
  # than a slow one.
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve exact release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.identity.outputs.ref }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: record checked-out identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${{ github.event.inputs.tag || github.ref }}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same matrix, verification and SBOM generation that gates every PR.
  build:
    uses: ./.github/workflows/wheels.yml
    needs: resolve
    with:
      source_ref: ${{ needs.resolve.outputs.ref }}
      source_revision: ${{ needs.resolve.outputs.revision }}
    permissions:
      contents: read

  # Reproduce the package evidence required by ADR 0033 on the exact release
  # tag. CI already runs these lanes, but the release workflow must retain the
  # bytes and receipts beside the wheels or downstream candidate assembly cannot
  # bind one coherent source revision.
  package-evidence:
    name: collect · crate and npm evidence
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/tritium-web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.11"
      - name: install locked packaging tools
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: package and qualify Rust crates
        env:
          SOURCE_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          ./scripts/check-publish.sh
          mkdir -p release-artifacts/crates
          cp target/package/*.crate release-artifacts/crates/
          python scripts/generate-crate-sboms.py \
            --archives target/package \
            --output release-artifacts/crates \
            --source-revision "$SOURCE_REVISION" \
            --source-date-epoch 0
          python scripts/qualify-crate-archives.py \
            --archives target/package \
            --source-revision "$SOURCE_REVISION" \
            --release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}-crate-archives" \
            --output release-artifacts/crates/crate-archive-qualification.json
      - name: package and qualify npm archive
        working-directory: packages/tritium-web
        env:
          TRITIUM_NPM_EVIDENCE_DIR: ${{ github.workspace }}/release-artifacts/npm
          TRITIUM_NPM_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-npm-archive
        run: |
          set -euo pipefail
          npm ci
          npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: release-package-evidence
          path: release-artifacts/
          if-no-files-found: error

  collect:
    name: collect · checksums
    needs: [resolve, build, package-evidence]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          # Named exactly, not `wheel-*`. wheels.yml also uploads
          # wheel-functional-*, wheel-tutorial-* and wheel-cuda13-* -- evidence
          # bundles that carry repo-root prefixes, so a glob lands DIRECTORIES in
          # staged/. `gh release upload` rejects a directory, and the version
          # assertion and checksums below only walk the top level, so the extra
          # trees would ship unchecked or break the upload outright.
          pattern: wheel-{linux-x86_64,macos-aarch64,windows-x64}
          path: staged
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: release-package-evidence
          path: staged/package-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: abi3-compatibility-receipt
          path: staged/compatibility-evidence
      - name: flatten package evidence into release payload
        shell: bash
        run: |
          set -euo pipefail
          cp staged/package-evidence/crates/*.crate staged/
          cp staged/package-evidence/crates/*.cdx.json staged/
          cp staged/package-evidence/crates/crate-archive-qualification.json staged/
          cp staged/package-evidence/npm/*.tgz staged/
          cp staged/package-evidence/npm/*.json staged/
          cp staged/compatibility-evidence/python-abi3-39-plus.json staged/
          rm -rf staged/package-evidence
          rm -rf staged/compatibility-evidence
      - name: assert the tag and the artifacts agree
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # PEP 440 normalises 1.1.0-rc.2 to 1.1.0rc2; compare on that spelling so a
          # wheel built from the wrong tree cannot be released under this tag.
          pep440="$(printf '%s' "$version" | tr -d '-' | sed 's/rc\./rc/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Derive the distribution name rather than writing it down. A literal here
          # would silently stop matching the day the project is renamed, and the
          # gate would pass by matching nothing.
          dist="$(python3 -c "
          import tomllib,pathlib
          print(tomllib.loads(pathlib.Path('crates/tritium-py/pyproject.toml').read_text())['project']['name'].replace('-','_'))
          ")"
          echo "expecting ${dist}-${pep440}-* wheels"
          # A stray directory means the artifact pattern over-matched; `gh release
          # upload` rejects directories, and the checks below only walk the top level.
          for d in staged/*/; do
            [ -e "$d" ] || continue
            echo "::error::staged/ contains a directory ($d) - the artifact pattern over-matched"
            exit 1
          done
          found=0
          for w in staged/*.whl; do
            found=$((found + 1))
            base="$(basename "$w")"
            case "$base" in
              "$dist"-"$pep440"-*) ;;
              *) echo "::error::$base is not ${dist}-${pep440} (tag $tag)"; exit 1 ;;
            esac
          done
          # Every platform, or none. A partial set publishes a release that fails to
          # install on the platforms whose wheel silently went missing -- which is
          # exactly how pytritium 1.1.0rc1 shipped Linux-only.
          missing=""
          for plat in manylinux_2_28_x86_64 macosx_11_0_arm64 win_amd64; do
            ls staged/*-"$plat".whl >/dev/null 2>&1 || missing="$missing $plat"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing platform wheels:$missing"; exit 1
          fi
          [ "$found" -eq 3 ] || { echo "::error::expected 3 wheels, found $found"; exit 1; }
          echo "all $found wheels carry ${dist}-${pep440}, every platform present"
      - name: emit deterministic release inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
          BUILDER_ID: https://github.com/${{ github.repository }}/actions/workflows/release.yml
          INVOCATION_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          staged = Path("staged")
          files = {
              path.name: path
              for path in staged.iterdir()
              if path.is_file() and path.suffix in {".whl", ".crate", ".tgz"}
          }
          artifacts = []
          seen = set()
          for sbom in sorted(staged.glob("*.cdx.json")):
              value = json.loads(sbom.read_text(encoding="utf-8"))
              component = value.get("metadata", {}).get("component", {})
              artifact_id = component.get("bom-ref")
              properties = {
                  item.get("name"): item.get("value")
                  for item in component.get("properties", [])
                  if isinstance(item, dict)
              }
              filename = properties.get("tritium:artifact:file")
              if not isinstance(artifact_id, str) or not artifact_id:
                  raise SystemExit(f"SBOM {sbom.name} lacks artifact id")
              if not isinstance(filename, str) or filename not in files:
                  raise SystemExit(f"SBOM {sbom.name} lacks a staged artifact binding")
              if artifact_id in seen:
                  raise SystemExit(f"duplicate release artifact id {artifact_id!r}")
              seen.add(artifact_id)
              suffix = Path(filename).suffix
              kind = {
                  ".whl": "python-wheel",
                  ".crate": "crate",
                  ".tgz": "npm-archive",
              }.get(suffix)
              if kind is None:
                  raise SystemExit(f"unsupported release artifact {filename!r}")
              artifacts.append({
                  "id": artifact_id,
                  "kind": kind,
                  "path": filename,
                  "sbom": sbom.name,
              })
          if not artifacts:
              raise SystemExit("no SBOM-bound release artifacts found")
          document = {
              "schema": "tritium.release-inputs.v1",
              "release": os.environ["RELEASE_VERSION"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "builder": {
                  "id": os.environ["BUILDER_ID"],
                  "build_type": "https://tritium.ai/build/package/v1",
                  "invocation_id": os.environ["INVOCATION_ID"],
              },
              "artifacts": sorted(artifacts, key=lambda item: item["id"]),
          }
          (staged / "release-inputs.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"artifacts": len(artifacts), "source_revision": document["source_revision"]}, sort_keys=True))
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          # `--` so an artifact whose name begins with a dash is a file, not a flag.
          sha256sum -- *.whl *.crate *.tgz *.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0
        with:
          name: release-bundle
          path: staged/
          if-no-files-found: error

  pypi:
    name: publish · PyPI
    needs: collect
    runs-on: ubuntu-latest
    # The environment is where the trusted publisher is scoped, and where a manual
    # approval gate can be added without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/project/pytritium/
    permissions:
      # OIDC only. No PyPI token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: release-bundle
          path: staged
      - name: keep only wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv staged/*.whl dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # A re-run after a partial upload must not fail the release.
          skip-existing: true
          attestations: true

  github-release:
    name: publish · GitHub Release
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation: this is what makes SECURITY.md's claim true.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: release-bundle
          path: staged
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/*.whl
      - name: notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          # A workflow_dispatch re-run checks out the TAG, and tags cut before this
          # pipeline existed have no release-notes.py -- v1.1.0-rc.1's tree is 320
          # commits behind main. Fall back to GitHub's generated notes rather than
          # failing a republish on a script the old tree never contained.
          if [ -f scripts/release-notes.py ]; then
            python scripts/release-notes.py "${{ needs.collect.outputs.version }}" > NOTES.md
          else
            echo "::notice::this tag predates scripts/release-notes.py; using generated notes"
            : > NOTES.md
          fi
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-rc.*|*-alpha*|*-beta*) prerelease="--prerelease" ;; esac
          # An empty NOTES.md means the fallback above fired; let GitHub generate them.
          notes=(--notes-file NOTES.md)
          [ -s NOTES.md ] || notes=(--generate-notes)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${notes[@]}" $prerelease
          else
            gh release create "$TAG" --title "$TAG" "${notes[@]}" $prerelease --verify-tag
          fi
          gh release upload "$TAG" staged/* --clobber

  crates:
    name: publish · crates.io
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/tritium-core
    permissions:
      contents: read
      # Required to mint the trusted-publishing token below. Without it the OIDC
      # step fails and the job silently falls back to the stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      # Preferred: crates.io trusted publishing. Mints a token that lives for the
      # length of this job, so nothing long-lived is stored. It is configured per
      # crate, and this workspace publishes 23 of them -- so a stored token stays
      # supported rather than making OIDC an all-or-nothing migration.
      - name: mint a short-lived crates.io token (OIDC)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Dormant until ONE of the two exists. `secrets` is not available to a
      # job-level `if:`, so the guard is a step: the job goes green having published
      # nothing, rather than failing every release until crates.io is wired up.
      - name: publish all crates in dependency order
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OIDC_TOKEN:-}" ]; then
            echo "::notice::publishing with a short-lived trusted-publishing token"
            export CARGO_REGISTRY_TOKEN="$OIDC_TOKEN"
          elif [ -n "${SECRET_TOKEN:-}" ]; then
            echo "::notice::publishing with the stored CARGO_REGISTRY_TOKEN secret"
            export CARGO_REGISTRY_TOKEN="$SECRET_TOKEN"
          else
            echo "::error::no crates.io credential. Register a trusted publisher"
            echo "(preferred) or set the CARGO_REGISTRY_TOKEN secret. Failing rather"
            echo "than reporting a green release that published nothing."
            exit 1
          fi
          # --yes-publish is REQUIRED. Without it publish-crates.sh takes its
          # dry-run branch, prints "PREFLIGHT OK" and exits 0 -- so the job went
          # green having uploaded no crate at all, with or without a credential.
          scripts/publish-crates.sh --yes-publish
