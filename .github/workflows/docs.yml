# mdbook user guide + dead-link gate (v0.90 hardening, ADR 0011).
#
# Builds the book under docs/book/ and FAILS on any dead internal link. The
# link check runs as the `mdbook-linkcheck` backend (wired in docs/book/book.toml
# with `warning-policy = "error"`), so `mdbook build` is the single gate — it
# behaves identically here and on a contributor's machine. `follow-web-links` is
# off in book.toml, so the gate is deterministic and offline: it never flakes on a
# third-party 5xx, and only the links Tritium owns (relative links to chapters and
# within the book tree) are checked. CPU-only, on every push + PR.
name: docs

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mdbook:
    name: mdbook build + dead-link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # Prebuilt binaries via taiki-e/install-action (matches ci.yml's lane style).
      # Pinned versions keep the gate reproducible; mdbook-linkcheck is the backend
      # mdbook invokes during `build`.
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: mdbook@0.4.43,mdbook-linkcheck@0.7.7
      - name: build the book + check links
        run: mdbook build docs/book
      - name: upload built book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tritium-book
          path: docs/book/book/html
          if-no-files-found: error

  # Cross-workflow jobs cannot be listed in ci.yml's `needs`; expose a stable
  # always-reporting check so branch protection can require `docs-required`
  # independently of the implementation job.
  docs-required:
    name: docs-required
    if: ${{ always() }}
    needs: [mdbook]
    runs-on: ubuntu-latest
    steps:
      - name: fail closed on documentation result
        env:
          RESULT: ${{ needs.mdbook.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "documentation dependency not green: $RESULT"
            exit 1
          fi
          echo "documentation dependency passed"
