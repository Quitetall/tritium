name: capstone (cpu e2e smoke)

# CPU fresh-env end-to-end capstone SMOKE (v1.0 prep, ADR 0012).
#
# Runs scripts/capstone.sh, which exercises the SHAPE of the v1.0 capstone
# pipeline — install/build -> infer -> SALT-quantize -> fine-tune — entirely on
# CPU, from a clean checkout. Every stage runs a REAL Tritium code path; nothing
# is mocked. The full-scale capstone (a real BitNet b1.58 GGUF decoding tokens +
# a GPU fine-tune that recovers accuracy/PPL) needs fenced hardware this lane
# does NOT have; the script documents each deferral inline and in its summary.
#
# Fast, deterministic, no GPU, no model download. Green on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  capstone-cpu:
    name: capstone cpu e2e smoke
    runs-on: ubuntu-latest
    env:
      # Match the project's required-lane discipline: warnings are errors so the
      # capstone build cannot drift behind cpu-only-green.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # python3 is preinstalled on ubuntu-latest; the script also degrades
      # gracefully (skips only the safetensors->.tslb sub-step) if it is absent.
      - name: run CPU capstone smoke
        run: ./scripts/capstone.sh
