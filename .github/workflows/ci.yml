name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC — drives the fuzz lane

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required lane: must be green on every push. No GPU, default features only.
  cpu-only-green:
    name: test · clippy · fmt (cpu-only)
    runs-on: ${{ matrix.os }}
    # Scoped here (not global) so the nightly fuzz lane, which sets its own
    # sanitizer RUSTFLAGS, is unaffected.
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # tritium-py is a PyO3 extension module (cdylib) with no cargo tests — it is
      # exercised via maturin + pytest, not `cargo test`. Excluded here so its
      # cdylib doesn't link libpython into a cargo-test binary, which fails to link
      # on the hosted macOS/Windows runners.
      - run: cargo test --workspace --exclude tritium-py # unit, integration, and doc tests

  # Supply-chain gate (ADR 0011 hardening): licenses (allow-list + NOTICE
  # attribution), RustSec advisories, bans (no external wildcard versions /
  # disallowed crates), and source registries. Fast + CPU-only, on every push +
  # PR. The action pins a recent cargo-deny that parses CVSS-4.0 advisories (the
  # locally-installed 0.16.x cannot), so this is the authoritative advisory gate.
  cargo-deny:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  # API-stability gate (ADR 0011/0012): no UNINTENTIONAL breaking change to the
  # stable public-API crates vs the last v0.5.* release tag. Pre-1.0 breaks are
  # allowed but must be deliberate; this surfaces them. fetch-depth: 0 so the
  # baseline tag + history are available to `git describe` in the script.
  semver:
    name: API stability (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: ./scripts/check-semver.sh

  # Scheduled fuzz lane (U5): every tritium-format parser, zero crashes.
  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      # ~1 hour split across EVERY tritium-format untrusted-byte parser (U5:
      # every parser introduced has a target). Looped so adding a parser is a
      # one-line change here + a new fuzz_targets/*.rs + a [[bin]] block.
      - name: fuzz all parsers
        working-directory: crates/tritium-format
        run: |
          for t in gguf_parse salt_gguf_parse sparse_plane_parse \
                   tqbin_parse tqidx_parse salt_bundle_parse \
                   safetensors_parse salt_legacy_parse; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_len=131072 -max_total_time=450
            echo "::endgroup::"
          done

  # GPU lane (U2 parity + CUDA conformance + compute-sanitizer). Self-hosted,
  # manual — runs only where a CUDA toolkit + NVIDIA GPU are present.
  gpu:
    name: cuda conformance + parity
    runs-on: [self-hosted, gpu]
    if: ${{ false }} # enable on a runner with nvcc + a GPU
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p tritium-cuda --features cuda
      - run: compute-sanitizer --tool memcheck cargo test -p tritium-cuda --features cuda

  # metal lane (Apple-Silicon backend breadth). Self-hosted, manual — runs only on
  # an Apple-Silicon runner with a Metal device. Mirrors the disabled `wgpu`/`gpu`
  # lanes: the same frozen-conformance + fused-fallback gates; the metal backend
  # self-skips when MTLCreateSystemDefaultDevice() is nil, so this is the only place
  # it bites. `register` exercises both the explicit ctor and the linkme self-
  # registration. The MSL kernel + metal-rs host side compile only here (no Metal
  # framework on the Linux CI matrix), so this lane is where they are first built.
  metal:
    name: metal conformance (apple silicon)
    runs-on: [self-hosted, macos] # or `macos-14` (Apple-Silicon GitHub-hosted)
    if: ${{ false }} # enable on an Apple-Silicon runner with a Metal device
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p tritium-metal --features register

  # ROCm lane (AMD HIP conformance). Self-hosted, manual — mirrors the `gpu` (CUDA)
  # lane: runs only where a ROCm toolkit (hipcc) + an AMD GPU are present. The
  # add-only HIP kernel + raw HIP-runtime FFI are behind the `rocm` feature; the
  # conformance test self-skips when `hipInit` finds no device, so this is the only
  # place the backend bites. Enable on an AMD-GPU runner with ROCm installed.
  rocm:
    name: rocm conformance (hip)
    runs-on: [self-hosted, rocm]
    if: ${{ false }} # enable on an AMD-GPU runner with the ROCm toolkit (hipcc)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p tritium-rocm --features rocm

  # Perf-regression lane (ADR 0005 WF-E / Pe). Scheduled on the pinned GPU box: runs
  # the end-to-end tokens/sec bench (which couples each perf number to an
  # unchanged-perplexity assertion) and fails on a >5% tokens/sec drop vs the
  # committed competitor baseline (`tritium_benches::BITNET_CPP_2B4T_DECODE`). Manual
  # for now (`if: false`) — enable on the self-hosted 4090 runner with nvcc + the
  # BitNet 2B4T GGUF present at the pinned cache path.
  perf-regression:
    name: perf regression (tok/s vs baseline)
    runs-on: [self-hosted, gpu]
    if: ${{ false }} # enable on the pinned 4090 runner with nvcc + the model
    needs: gpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The bench fixtures + baseline/regression logic are unit-tested on every lane;
      # this asserts they hold under -D warnings on the GPU toolchain too.
      - run: cargo test -p tritium-benches --features cuda
      # Compile the GPU + e2e benches (nvcc PTX build) and run the e2e tok/s bench.
      # The bench asserts perplexity-within-1% before timing (panics on drift), then
      # asserts the decode-only tok/s is not >5% below the recorded competitor baseline
      # — both `assert!`s fail the bench process and thus this job. The published
      # baseline is a conservative floor; tighten it to a `BuiltOnBox` number to make
      # the gate bite on real kernel regressions.
      - run: cargo bench -p tritium-benches --features cuda --bench e2e

  # CPU bench smoke (v0.90 hardening). Hosted ubuntu, every push: compiles ALL
  # benches (catches bench bit-rot, incl. the cuda-gated gpu_mpgemm/e2e shells)
  # and runs the CPU `mpgemm` divan microbench end to end. This is the hosted half
  # of the perf gate — it keeps the bench harness runnable on every push without a
  # GPU; the tok/s *regression* assertion (vs the competitor baseline) stays in the
  # self-hosted `perf-regression` lane above, which needs the 4090 + the model.
  cpu-bench-smoke:
    name: cpu bench smoke (divan mpgemm)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p tritium-benches --benches
      - run: cargo bench -p tritium-benches --bench mpgemm

  # wasm lane (v0.70 backend breadth). Hosted ubuntu, no GPU, no sudo: adds the
  # wasm32-wasip1 target, installs the wasmtime CLI (Cranelift), and runs the
  # tritium-wasm conformance + fused-fallback gates INSIDE the wasm guest. The
  # .cargo/config.toml `runner = "wasmtime --dir=."` makes `cargo test --target`
  # transparently execute the test harness under wasmtime. Green on every push.
  wasm:
    name: wasm conformance (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - run: cargo test --target wasm32-wasip1 -p tritium-wasm

  # wgpu lane (v0.70 backend breadth). Self-hosted, manual — runs only where a
  # Vulkan adapter + driver are present (the 4090 box). Mirrors the disabled `gpu`
  # (CUDA) lane: the same frozen-conformance + fused-fallback gates; the wgpu
  # backend self-skips with no adapter, so this is the only place it actually
  # bites. `register` exercises both the explicit ctor and the linkme self-
  # registration on a target where linkme is available.
  wgpu:
    name: wgpu conformance (vulkan)
    runs-on: [self-hosted, gpu]
    if: ${{ false }} # enable on a runner with a Vulkan adapter + driver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: vulkan runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 vulkan-tools
      - run: cargo test -p tritium-wgpu --features register

  # serve contract lane (v0.80 interop). Hosted ubuntu, every push: the OpenAI
  # wire contract (schema, SSE framing, stream==buffered, finish_reason, stop
  # strings, concurrency, backpressure, graceful shutdown) is proven model-free
  # via MockGenerator. No GPU, no model.
  serve-contract:
    name: serve contract (cpu, mock)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p tritium-serve --features serve --all-targets -- -D warnings
      - run: cargo test -p tritium-serve --features serve

  # serve real-model e2e (v0.80). Manual — needs a GGUF + the e2e feature.
  serve-e2e:
    name: serve e2e (real model)
    runs-on: [self-hosted, gpu]
    if: ${{ false }} # enable with TRITIUM_SERVE_E2E=1 + TRITIUM_MODEL_PATH set
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p tritium-serve --features e2e -- --ignored serve_e2e_token_id_roundtrip

  # candle interop lane (v0.80). Hosted ubuntu, every push: the candle `CustomOp1`
  # conformance gate proves the op reproduces the frozen vector set at the candle
  # Tensor level (bit-exact — it runs the same reference kernel). candle-core is
  # CPU-only here; no GPU, no model. Built with `--features candle` (off by
  # default so the lean workspace build + `cargo test --workspace` stay
  # candle-free), mirroring the serve-contract lane.
  candle-conformance:
    name: candle interop (cpu)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p tritium-candle --features candle --all-targets -- -D warnings
      - run: cargo test -p tritium-candle --features candle

  # burn interop lane (v0.80). Hosted ubuntu, every push: the burn host-round-trip
  # op conformance gate proves the op reproduces the frozen vector set at the burn
  # Tensor level (bit-exact — same reference kernel) on burn's CPU NdArray backend.
  # No GPU, no model. Built with `--features burn` (off by default so the lean
  # workspace build + `cargo test --workspace` stay burn-free), mirroring
  # candle-conformance.
  burn-conformance:
    name: burn interop (cpu)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p tritium-burn --features burn --all-targets -- -D warnings
      - run: cargo test -p tritium-burn --features burn

  # onnx custom-op lane (v0.80). Hosted ubuntu, every push: builds + tests the `ort`
  # 2.x custom operator (Layer 2). The always-on Layer-1 kernel conformance gate
  # already runs in cpu-only-green with NO feature (zero ort). `ort`'s
  # `download-binaries` (+ `tls-rustls`) fetches a prebuilt onnxruntime at build —
  # network is available during the CI build, so no system lib is required. The op
  # (and the heavy `ort` dep) live behind the `onnx` feature, off by default so the
  # lean workspace build stays ort-free. The full end-to-end native session test is
  # `#[ignore]`d; the registration + bit-exact kernel tests run here.
  onnx-op:
    name: onnx custom op (cpu)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p tritium-onnx --features onnx --all-targets -- -D warnings
      - run: cargo test -p tritium-onnx --features onnx

  # Publish-readiness gate (ADR 0011 / v0.90): every workspace crate packages into a
  # valid .crate (manifest + files + version-pinned internal deps). See
  # scripts/check-publish.sh for why this is `cargo package --workspace` rather than
  # per-crate `cargo publish --dry-run`.
  publish-check:
    name: publish readiness (cargo package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/check-publish.sh

  # SBOM (ADR 0011 / v0.90): generate a CycloneDX software bill of materials for the
  # whole workspace and upload it as a build artifact.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
