# Tritium — foundational ternary-model inference & training library.
# Virtual workspace. Deps point inward: foundation → backends → runtime → frontends.
# A frontend never depends on a concrete backend; a backend never depends on another backend.

[workspace]
resolver = "3"
members = [
    "crates/tritium-core",
    "crates/tritium-spec",     # backend trait contract, no impls
    "crates/tritium-format",   # TQ1_0/TQ2_0 packing, GGUF + safetensors I/O
    "crates/tritium-testkit",  # reference vectors + conformance harness
    "crates/tritium-runtime",  # registry, dispatch (linkme self-registration)
    "crates/tritium-cpu",      # AVX2 + scalar ternary mpGEMM
    "crates/tritium-cuda",     # cudarc host + add-only .cu kernel (feature-gated)
    "crates/tritium-cli",      # `tritium` binary: inspect, list-backends, generate
    "crates/tritium-py",       # PyO3 + maturin Python bindings (cdylib wheel)
    # ── enabled as each lands (see docs/ROADMAP for the full crate graph) ──
    # L1 backends
    "crates/tritium-metal",    # MSL mpGEMM over Apple Metal (macOS-gated; empty lib off macOS)
    "crates/tritium-rocm",     # AMD ROCm/HIP host (raw FFI) + add-only .hip kernel (rocm-feature-gated)
    "crates/tritium-wgpu",     # WGSL mpGEMM over wgpu (Vulkan)
    # L2 runtime + functional
    # "crates/tritium-runtime",  # registry, dispatch, mem pools, autotune cache
    "crates/tritium-quantize", # SALT: fp -> ternary plane stacks (ADR 0001/0006)
    "crates/tritium-nn",       # mixed-precision ops + model runner
    "benches",                 # divan microbenches + perf harness (v0.30, ADR 0005)
    "crates/tritium-train",     # QAT, STE autograd, optimizer (ADR 0007)
    # L3 frontends / bindings
    "crates/tritium-ffi",      # C ABI cdylib + staticlib + cbindgen header
    # "crates/tritium-py",       # PyO3 + maturin
    "crates/tritium-onnx",     # ort 2.x custom op (feature-gated; always-on bit-exact kernel)
    "crates/tritium-candle",   # candle CustomOp wrapping the ternary mpGEMM (feature-gated)
    "crates/tritium-burn",     # burn op wrapping the ternary mpGEMM (feature-gated)
    "crates/tritium-wasm",     # scalar TernaryBackend for wasm32-wasip1
    # L4 apps
    # "crates/tritium-cli",      # `tritium` binary
    "crates/tritium-serve",    # OpenAI-compatible HTTP/SSE server (feature-gated)
    # "xtask",                   # build orchestration / codegen / release
]

[workspace.package]
version = "0.6.9"              # SemVer (MAJOR.MINOR.PATCH); see CHANGELOG versioning note
edition = "2024"
rust-version = "1.89"          # AVX-512 intrinsics stable floor (Rust 1.89, 2025-08-07)
license = "Apache-2.0"         # FOSS; see LICENSE. Vendored deps attributed in NOTICE.
repository = "https://github.com/Quitetall/tritium"
authors = ["Brian Lam <briankhanglam@gmail.com>"]
keywords = ["ternary", "bitnet", "quantization", "inference", "cuda"]
categories = ["science", "hardware-support", "mathematics"]

# Shared dependency versions — crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# internal crates (path + caret version, bumped in lockstep with the workspace version at each
# minor release). The explicit version is required for `cargo publish` (crates.io forbids bare path
# deps) and lets cargo-deny keep `wildcards = "deny"` meaningful for *external* deps.
tritium-core = { path = "crates/tritium-core", version = "0.6.9" }
tritium-spec = { path = "crates/tritium-spec", version = "0.6.9" }
tritium-format = { path = "crates/tritium-format", version = "0.6.9" }
tritium-runtime = { path = "crates/tritium-runtime", version = "0.6.9" }
tritium-testkit = { path = "crates/tritium-testkit", version = "0.6.9" }
tritium-cpu = { path = "crates/tritium-cpu", version = "0.6.9" }
tritium-cuda = { path = "crates/tritium-cuda", version = "0.6.9" }
tritium-quantize = { path = "crates/tritium-quantize", version = "0.6.9" }
tritium-nn = { path = "crates/tritium-nn", version = "0.6.9" }
tritium-train = { path = "crates/tritium-train", version = "0.6.9" }
# foundation
bytemuck = "1"
half = "2"
linkme = "0.3"
# cpu
rayon = "1"
# cuda
cudarc = "0.13"
cc = "1"
# ffi (C ABI): cbindgen regenerates include/tritium.h in a dev-only drift test
cbindgen = "0.29"
# wgpu backend (WGSL mpGEMM over Vulkan); exact pin keeps cargo-deny wildcards=deny meaningful
wgpu = { version = "=23.0.1", default-features = false, features = ["wgsl"] }
pollster = "0.4"
# metal backend (MSL mpGEMM over Apple Metal, tritium-metal). metal-rs is declared under
# tritium-metal's [target.'cfg(target_os = "macos")'] table, so it is NEVER resolved on a
# non-macOS host. Exact pin keeps cargo-deny wildcards=deny meaningful. (tritium-rocm needs no
# external dep — it uses raw extern "C" FFI to the HIP runtime, compiled via hipcc in build.rs.)
metal = "=0.33.0"
# bindings / frontends
# pyo3 0.29.x: clears RUSTSEC-2025-0020 + RUSTSEC-2026-0176 (PyList/PyTuple nth OOB) +
# the missing-Sync PyCFunction advisory. tritium-py uses the modern Bound API (stable here).
pyo3 = "0.29"
# onnx interop (tritium-onnx, behind its `onnx` feature). default-features off so the crate opts
# into exactly download-binaries + tls-rustls (fetch a prebuilt onnxruntime at build — no system
# lib). Exact pin keeps cargo-deny wildcards=deny meaningful. rc.12 wraps ONNX Runtime 1.24.
ort = { version = "=2.0.0-rc.12", default-features = false }
# candle interop (tritium-candle, behind its `candle` feature; CPU-only — no cuda/mkl/accelerate)
candle-core = { version = "0.9", default-features = false }
# burn interop (tritium-burn, behind its `burn` feature; CPU-only NdArray backend in the test).
# burn-tensor gives Tensor/Backend/TensorData; burn-ndarray is the concrete CPU backend. `std`
# (needed for NdArray + TensorData::to_vec) pulls the MPL-2.0 `colored` crate (allow-listed in deny.toml).
burn-tensor = { version = "0.21", default-features = false, features = ["std"] }
burn-ndarray = { version = "0.21", default-features = false, features = ["std"] }
# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# serve (OpenAI HTTP/SSE server; all behind tritium-serve's `serve` feature)
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
async-stream = "0.3"
futures-core = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# dev / test / bench
proptest = "1"
divan = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lints applied workspace-wide; crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# hot-path discipline: no hidden panics in kernels
indexing_slicing = "allow"   # re-enable per-crate in backends once bounds are proven

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Fat LTO + max opt for shipped kernels; slow to build, used for wheels/benches.
[profile.dist]
inherits = "release"
lto = "fat"
