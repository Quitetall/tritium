[package]
name = "tritium-benches"
description = "Divan microbenchmarks + end-to-end perf harness for Tritium (v0.30)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tritium-core = { workspace = true }
tritium-spec = { workspace = true }
tritium-cpu = { workspace = true }
tritium-format = { workspace = true }
half = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
# The runtime registry is how the GPU + e2e benches obtain an owned backend trait
# object (find the registered `init` by name), exactly as `tests/acceptance.rs` does.
tritium-runtime = { workspace = true }
# The end-to-end tokens/sec bench drives the v0.20 `ModelRunner` over the real GGUF.
tritium-nn = { workspace = true }
# The CUDA backend, linked ONLY for the GPU lane. It is a dev-dependency with its own
# `cuda` feature off by default, so the standard cpu-only build/bench of this crate
# pulls in no `cudarc` and runs no `nvcc`. The crate-level `cuda` feature below turns
# it on so the backend self-registers as `"cuda"` into the runtime `BACKENDS` slice.
tritium-cuda = { workspace = true }
# The non-NVIDIA backends, linked on the same terms as tritium-cuda above: present
# as dev-dependencies (cargo has no optional dev-dependencies) but inert stubs until
# the crate features below turn on their own `register` / `rocm` gates. Without this
# linkage no AMD or Vulkan box can produce a GPU bench number at all (issue #4).
tritium-wgpu = { workspace = true }
tritium-rocm = { workspace = true }
tritium-metal = { workspace = true }
# Parse the committed `tools/reference/bitnet_accept.json` (token IDs + reference
# perplexity) the end-to-end bench couples its tokens/sec to.
serde = { workspace = true }
serde_json = { workspace = true }

# `cargo bench -p tritium-benches --features cuda` enables the CUDA backend (and its
# build.rs `nvcc` PTX compile) so the GPU mpGEMM microbenches and the end-to-end
# tokens/sec bench can run on the `"cuda"` backend. Without the feature the GPU bench
# bodies compile out entirely (`#[cfg(feature = "cuda")]`), keeping cpu-only lanes
# (no GPU, no CUDA toolkit) building. The feature forwards to the CUDA backend's own
# `cuda` feature via `tritium-nn`'s, plus its own `tritium-cuda/cuda` so the bench
# crate can name `CudaBackend` directly.
[features]
default = []
cuda = ["tritium-cuda/cuda", "tritium-nn/cuda"]
# Non-NVIDIA GPU lanes, mirroring `cuda`. Each turns on its crate's registration
# feature so the backend self-registers into `BACKENDS` and the GPU bench bodies can
# resolve it by name. Independent of `cuda` and of each other; `gpu_mpgemm` runs the
# add-only family across every backend enabled here. `rocm` needs a ROCm toolkit at
# build time (its build.rs shells `hipcc`), which is why nothing implies it.
wgpu = ["tritium-wgpu/register"]
rocm = ["tritium-rocm/rocm"]
# Apple Silicon. Inert off macOS: every device path in tritium-metal is additionally
# `cfg(target_os = "macos")`.
metal = ["tritium-metal/register"]

# WF-E benches. `mpgemm` (CPU, always-on) is the v0.30 skeleton baseline. The GPU
# mpGEMM microbenches + the end-to-end tokens/sec bench have `cuda`-gated bodies, so
# they build everywhere but only do work with `--features cuda` (and, for e2e, the
# model present). `roofline` is pure host arithmetic — it always runs, printing the
# decode ceiling + the committed competitor baselines.
[[bench]]
name = "mpgemm"
harness = false

[[bench]]
name = "gpu_mpgemm"
harness = false

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "roofline"
harness = false

[[bench]]
name = "salt_codec"
harness = false
