# cargo-deny: license + advisory gate. Run in CI.
# Tritium vendors MIT (T-MAC, BitBLAS, ggml, ExLlamaV2) and Apache-2.0 (Marlin);
# every upstream license must stay allowed + attributed in NOTICE.

[advisories]
yanked = "deny"
# RUSTSEC-2024-0436: `paste` is unmaintained (not a vulnerability). It enters the
# graph only on Apple targets, as a build-time proc-macro transitive of
# `wgpu` → `wgpu-hal` → `metal` (the macOS/iOS HAL); it is never compiled on the
# Linux/CUDA path. No maintained drop-in replacement exists upstream yet. Revisit
# when a future wgpu drops it. Low risk: proc-macro, compile-time only.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
# Unicode-3.0 is the license of `unicode-ident` (a transitive dep of serde/syn etc.),
# a permissive Unicode license. It is a normal Cargo dependency (not a vendored code
# port like T-MAC/BitNet/ggml/Marlin), so it is NOT listed in NOTICE — bundling
# dependency license texts is deferred to the v1.0 packaging work.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # CC0-1.0: public-domain dedication (FSF Free/Libre, no attribution required) —
    # license of `hexf-parse`, a hex-float parser transitive of `naga` (wgpu's
    # shader compiler) ← `tritium-wgpu`. Surfaced once the pyo3 advisory cleared.
    "CC0-1.0",
    # MPL-2.0: file-level weak copyleft (OSI-approved, FSF Free/Libre) — license of
    # `colored`, a terminal-color crate pulled by `burn-tensor`'s mandatory `std`
    # feature ← `tritium-burn` (only under `--features burn`). MPL-2.0 requires only
    # that modified MPL-covered FILES stay MPL; it does not infect the Apache-2.0
    # work that merely links `colored` (which we do not modify).
    "MPL-2.0",
    # CDLA-Permissive-2.0: permissive data license — license of `webpki-roots` (the
    # Mozilla CA root-store data bundle) pulled by `ort`'s `tls-rustls` download path
    # ← `tritium-onnx` (only under `--features onnx`). A data bundle, not code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Deny external wildcard version requirements, but allow them for in-workspace
# `path`/`workspace = true` deps — every internal Tritium crate is pinned by path,
# so its version requirement is a (harmless) wildcard.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
